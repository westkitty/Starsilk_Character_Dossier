name: Musical live byte parity (temporary)
on:
  push:
    branches: [verify/musical-live-parity-20261027]
permissions:
  contents: write
jobs:
  live-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify exact main source and Pages HTML
        shell: bash
        env:
          EXPECTED_MAIN_SHA: f797fc2dbcbdd3904e05a1f8f3cc85d88ee104d9
          BASE_URL: https://westkitty.github.io/Starsilk_Character_Dossier
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-tree HEAD^ docs/musical/index.html | wc -l | tr -d ' ')" = "1"
          for attempt in $(seq 1 16); do
            curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
              "$BASE_URL/?musical_proof=$EXPECTED_MAIN_SHA&attempt=$attempt" -o /tmp/live-root.html || true
            curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
              "$BASE_URL/musical/?musical_proof=$EXPECTED_MAIN_SHA&attempt=$attempt" -o /tmp/live-musical.html || true
            curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
              "$BASE_URL/musical/AUTHORITY.md?musical_proof=$EXPECTED_MAIN_SHA&attempt=$attempt" -o /tmp/live-authority.md || true
            if test -s /tmp/live-root.html && test -s /tmp/live-musical.html && test -s /tmp/live-authority.md \
              && grep -Fq 'href="musical/"' /tmp/live-root.html \
              && grep -Fq 'id="compendium-musical-frame"' /tmp/live-musical.html \
              && cmp -s docs/musical/index.html /tmp/live-musical.html \
              && cmp -s docs/musical/AUTHORITY.md /tmp/live-authority.md; then
              echo "LIVE_MUSICAL_EXACT_PARITY=PASS"
              echo "MERGED_MAIN_SHA=$EXPECTED_MAIN_SHA"
              wc -c docs/musical/index.html /tmp/live-musical.html
              sha256sum docs/musical/index.html /tmp/live-musical.html docs/musical/AUTHORITY.md /tmp/live-authority.md
              echo "ROOT_NAVIGATION_MUSICAL_LINK=PASS"
              exit 0
            fi
            echo "Attempt $attempt: live root/link or musical bytes not converged"
            sleep 5
          done
          echo "::error::Musical live HTML or authority file does not match merged main"
          exit 1
      - name: Retire temporary proof workflow on success
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/musical-live-parity.yml
          git commit -m "Retire temporary Musical live parity verifier"
          git push origin HEAD:refs/heads/verify/musical-live-parity-20261027
