name: Palimpsest generated-output sync

on:
  push:
    branches:
      - feature/palimpsest-first-contact

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[palimpsest-generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/palimpsest-first-contact
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Regenerate derivation projection and public output
        run: |
          python3 tools/validate_derivation_map.py --write-projection
          ./tools/build.sh
          ./tools/build.sh --check
          git diff --check

      - name: Commit deterministic derivatives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ src/system/DERIVATION_GRAPH.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "build(palimpsest): sync deterministic derivatives [palimpsest-generated]"
          git push origin HEAD:feature/palimpsest-first-contact
