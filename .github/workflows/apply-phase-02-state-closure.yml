name: Apply Phase 02 state closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  close-state:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch durable roadmap and Operational State
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one replacement target, found {count}")
              return text.replace(old, new, 1)

          roadmap_path = Path("MUSEUM_AI_ROADMAP.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          roadmap = replace_once(
              roadmap,
              "| 2 | Machine Publication Layer | NOT STARTED | — | begin only in a fresh chat after verifying Phase 1 on current `main` |",
              "| 2 | Machine Publication Layer | COMPLETE | PR #12; final head `e64068a821df51cfb67cdd335007287d64d31fc7`; CI `32639102690` PASS; merged `d23d940ae306017550ef69265f0bea8d64a7c303`; live proof `32639347205` PASS | none |",
              "roadmap phase-2 ledger",
          )
          roadmap = replace_once(
              roadmap,
              "| 3 | Stable Entity Pages and Permalinks | NOT STARTED | — | deferred |",
              "| 3 | Stable Entity Pages and Permalinks | NOT STARTED | — | begin only in a fresh chat after verifying Phase 2 on current `main` |",
              "roadmap phase-3 deferral",
          )
          phase2_contract = "### Phase 2 — Machine Publication Layer\n\nGenerate deterministic public machine entry points: versioned schemas, project/entity indexes, Markdown alternatives, relationship JSON, sitemap/orientation surfaces, source/authority documentation, and only semantically valid JSON-LD. Verify all public URLs and boundaries live.\n"
          phase2_complete = phase2_contract + """

#### Completion record

- starting `main`: `55427686853a8f8ee049ad38b01fe92ec097aa20`
- work branch: `phase-02-machine-publication`
- primary implementation commit: `d4d73223a2f5975945ad1aa607f1880f0a54936a`
- one bounded implementation repair: `0f42f2527ac3bef7b1d17e8bb5322363a1f87e0e`
- repair reason: the focused test incorrectly required `llms.txt` to link to itself; the assertion was corrected without changing publication semantics
- exact generated-publication commit: `d60b66214598f0263d79d48059d32e715e9699c9`
- final CI head: `e64068a821df51cfb67cdd335007287d64d31fc7`
- successful required CI: `32639102690`
- implementation PR: `#12`
- implementation merge on `main`: `d23d940ae306017550ef69265f0bea8d64a7c303`
- execution-only live proof PR: `#13`, closed unmerged
- successful live proof: run `32639347205`, job `97193914513`
- machine entity index: 127 authored top-level `src/content/sections.json` records; this is deliberately distinct from the existing DOM validator's 138 rendered `<section>` count
- observed relationship graph: 136 `mentions` edges, each classified `observed-xref`
- public machine surface: 14 declared URLs total (site root + 13 text/machine files)
- live proof result: all 13 non-root files were byte-identical to merged `docs/`; root retained current Compendium markers; downloaded live machine files passed `tools/check_public_boundary.py`
- Phase 2 did not add entity HTML pages, event IDs, WorldsVault IDs, richer relationship semantics, new dependencies, canon prose, media-source mutations, or public UI redesign

**Completion verdict: VERIFIED.**
"""
          roadmap = replace_once(roadmap, phase2_contract, phase2_complete, "roadmap phase-2 completion record")
          roadmap_path.write_text(roadmap, encoding="utf-8")

          state_path = Path("OPERATIONAL_STATE.md")
          state = state_path.read_text(encoding="utf-8")
          state = replace_once(state, "revision: 9", "revision: 10", "state revision")
          state = replace_once(
              state,
              "- Museum + AI Phase 1 PR #11 merged at `ea287f572264eee625708d22b95a2d482b7d8a87`.\n",
              "- Museum + AI Phase 1 PR #11 merged at `ea287f572264eee625708d22b95a2d482b7d8a87`.\n- Museum + AI Phase 2 PR #12 merged at `d23d940ae306017550ef69265f0bea8d64a7c303`.\n",
              "state baseline phase-2 merge",
          )
          state = replace_once(
              state,
              "- `src/schema/metadata-record.schema.json` is the v1 metadata wrapper contract; it stores provenance/status/identity metadata and must not become a duplicate canon prose database.\n",
              "- `src/schema/metadata-record.schema.json` is the v1 metadata wrapper contract; it stores provenance/status/identity metadata and must not become a duplicate canon prose database.\n- `build/machine_publication.py` owns deterministic generation of `docs/machine/`, `docs/llms.txt`, and `docs/sitemap.xml`; those files are public generated derivatives, not lore authority.\n- `src/machine/AUTHORITY.md` and `src/schema/*` are the authored source surfaces for Phase 2 public authority notes and versioned machine schemas.\n",
              "state baseline phase-2 publication surfaces",
          )
          state = replace_once(
              state,
              "21. Future public machine exports must pass `tools/check_public_boundary.py` and retain source/evidence references. JavaScript hiding, Archive mode, `ajd`, robots metadata, and agent-orientation files are not privacy controls.\n",
              "21. Future public machine exports must pass `tools/check_public_boundary.py` and retain source/evidence references. JavaScript hiding, Archive mode, `ajd`, robots metadata, and agent-orientation files are not privacy controls.\n22. `docs/machine/`, `docs/llms.txt`, and `docs/sitemap.xml` are generator-owned derivatives. They must remain reproducible from declared source authority and must not be hand-promoted into a second canon database.\n23. The Phase 2 entity index mirrors the 127 authored top-level records in `src/content/sections.json`. The existing validator's 138 rendered `<section>` count is a different DOM-level invariant; neither count should be forced to equal the other.\n24. Public relationship output may expose only observed xref `mentions` / `observed-xref` evidence until an explicit semantic authority is authored.\n25. Phase 2 JSON-LD is structural `CreativeWork` / `hasPart` metadata only. Do not type fictional subjects as real `Person` entities or infer unsupported schema.org relationships.\n26. Any new public machine URL must be generator-owned, declared in the machine index/sitemap as appropriate, boundary-checked before merge, and independently verified at the live Pages edge when publication changes.\n",
              "state phase-2 invariants",
          )
          phase1_end = "Because Phase 1 did not change `docs/` or introduce a public machine artifact, a GitHub Pages rebuild/live-edge publication proof was not required for this phase. The previously verified Pages authority remains `legacy / main /docs` unless a future authoritative read proves otherwise.\n\n"
          phase2_state = phase1_end + """## Museum + AI Phase 2 machine publication — VERIFIED

Phase 2 of 12, **Machine Publication Layer**, is complete.

Repository evidence:

- starting `main`: `55427686853a8f8ee049ad38b01fe92ec097aa20`
- work branch: `phase-02-machine-publication`
- primary implementation commit: `d4d73223a2f5975945ad1aa607f1880f0a54936a`
- one bounded implementation repair: `0f42f2527ac3bef7b1d17e8bb5322363a1f87e0e`
- exact generated-publication commit: `d60b66214598f0263d79d48059d32e715e9699c9`
- final validation head: `e64068a821df51cfb67cdd335007287d64d31fc7`
- successful CI: run `32639102690`
- PR: `#12`
- merged to `main`: `d23d940ae306017550ef69265f0bea8d64a7c303`

Phase 2 verified capabilities:

- `build/machine_publication.py` deterministically generates and checks the complete Phase 2 public machine surface.
- `tools/build.sh` now owns both human HTML and machine-publication generation/checking, followed by strict canon/DOM validation and the public-boundary gate.
- `docs/machine/index.json` is the finite public orientation/index surface.
- `docs/machine/entities.json` contains 127 records, exactly matching authored top-level `src/content/sections.json` IDs in source order. This intentionally differs from the existing DOM validator's 138 rendered `<section>` count.
- `docs/machine/relationships.json` contains 136 observed xref relationships and exposes only `kind=mentions` with `evidence_class=observed-xref`.
- `docs/machine/project.jsonld` describes the Compendium and section resources using conservative structural `CreativeWork` / `hasPart` semantics only.
- `docs/machine/compendium.md` and `docs/machine/entities.md` provide deterministic Markdown alternatives.
- public v1 schemas are copied byte-for-byte from authored `src/schema/` sources into `docs/machine/schema/v1/`.
- `docs/llms.txt`, `docs/sitemap.xml`, and generated `docs/machine/AUTHORITY.md` provide orientation, URL discovery, authority, evidence, unknown-state, and interpretation rules.
- no chronology-event IDs, WorldsVault record IDs, coordinates, richer semantic relationships, per-section canon statuses, or other unauthored facts were invented.
- no public Compendium UI, canon prose, media source, dependency set, or Phase 3 entity-page surface was changed.

Final CI run `32639102690` on head `e64068a821df51cfb67cdd335007287d64d31fc7` passed:

- source build;
- deterministic committed `docs/` parity, including machine publication;
- strict existing DOM/canon validation;
- public machine-boundary validation;
- `git diff --check`;
- full Chromium pytest + Playwright suite;
- representative Firefox journeys;
- representative WebKit journeys.

Live publication was independently verified by execution-only PR #13, which was closed without merge after proof. GitHub Actions run `32639347205`, job `97193914513`, fetched the cache-busted GitHub Pages edge and established:

- `LIVE_MACHINE_PROOF_OK urls=14 records=127 exact_machine_files=13`;
- all 13 non-root declared public machine/text files were byte-identical to the merged `docs/` files;
- the root still contained the current `dossierSearch` and `Archive tools` markers;
- live entity records retained `visibility=public` and `canon_status=unknown`;
- live relationship edges remained `mentions` / `observed-xref` only;
- live JSON-LD remained `CreativeWork`-only structural metadata;
- the downloaded live publication passed `tools/check_public_boundary.py` across 13 text/machine files.

Therefore Phase 2 is **VERIFIED COMPLETE** at repository, CI, merge, and live-publication layers.

"""
          state = replace_once(state, phase1_end, phase2_state, "state phase-2 verified section")
          state = replace_once(
              state,
              "- Museum + AI program: Phase 2 of 12 — Machine Publication Layer. It must begin only in a fresh chat after re-reading `MUSEUM_AI_ROADMAP.md`, this Operational State, current `main`, and relevant CI/publication state.\n",
              "- Museum + AI program: Phase 3 of 12 — Stable Entity Pages and Permalinks. It must begin only in a fresh chat after re-reading `MUSEUM_AI_ROADMAP.md`, this Operational State, current `main`, and relevant CI/publication state.\n",
              "state pending phase",
          )
          state = replace_once(
              state,
              "- Revision 9: completed Museum + AI Phase 1. Added the durable twelve-phase roadmap, authority/stable-identity/publication contract, v1 metadata schema, dependency-free metadata validation, future public-machine boundary checks, focused regression tests, explicit unknown handling, and independent visibility/canon/spoiler semantics; PR #11 passed required Chromium/Firefox/WebKit CI after one bounded test-only repair and merged at `ea287f572264eee625708d22b95a2d482b7d8a87`.\n",
              "- Revision 9: completed Museum + AI Phase 1. Added the durable twelve-phase roadmap, authority/stable-identity/publication contract, v1 metadata schema, dependency-free metadata validation, future public-machine boundary checks, focused regression tests, explicit unknown handling, and independent visibility/canon/spoiler semantics; PR #11 passed required Chromium/Firefox/WebKit CI after one bounded test-only repair and merged at `ea287f572264eee625708d22b95a2d482b7d8a87`.\n- Revision 10: completed Museum + AI Phase 2. Added deterministic public machine generation, versioned schemas, 127 section-backed records, 136 observed `mentions` relationships, Markdown alternatives, conservative `CreativeWork` JSON-LD, `llms.txt`, sitemap, authority notes, build integration, public-boundary checks, and exact live-edge verification of all 14 declared URLs; PR #12 passed final Chromium/Firefox/WebKit CI and merged at `d23d940ae306017550ef69265f0bea8d64a7c303`; live proof run `32639347205` passed and proof PR #13 was closed unmerged.\n",
              "state revision log",
          )
          state_path.write_text(state, encoding="utf-8")
          PY

      - name: Verify closure diff and commit it
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-phase-02-state-closure.yml
          git add MUSEUM_AI_ROADMAP.md OPERATIONAL_STATE.md
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          printf '%s\n' "$staged" | grep -Fx '.github/workflows/apply-phase-02-state-closure.yml'
          printf '%s\n' "$staged" | grep -Fx 'MUSEUM_AI_ROADMAP.md'
          printf '%s\n' "$staged" | grep -Fx 'OPERATIONAL_STATE.md'
          if printf '%s\n' "$staged" | grep -Ev '^(\.github/workflows/apply-phase-02-state-closure\.yml|MUSEUM_AI_ROADMAP\.md|OPERATIONAL_STATE\.md)$'; then
            echo "::error::Unexpected state-closure path."
            exit 1
          fi
          git commit -m "docs(phase-02): close machine publication state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
