name: Bootstrap Operational State Sentinel

on:
  push:
    branches: [uplift/operational-state-sentinel]
    paths:
      - ".github/workflows/state-sentinel-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch-existing-ledgers:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uplift/operational-state-sentinel
          fetch-depth: 1

      - name: Patch existing state and topology ledgers deterministically
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          state_path = root / 'OPERATIONAL_STATE.md'
          state = state_path.read_text(encoding='utf-8')

          old_header = "project_name: Starsilk Compendium\nrevision: 21\n"
          new_header = (
              "project_name: Starsilk Compendium\n"
              "revision: 22\n"
              "freshness_policy: src/system/operational-state-policy.json\n"
          )
          if old_header not in state:
              raise SystemExit('expected revision-21 Operational State header not found')
          state = state.replace(old_header, new_header, 1)

          stale_visual = (
              "- Visual-coverage work unit PR #47 (`repair/visual-coverage-provenance`) is source/build/docs verified at revision 21: "
              "clean read-only CI run `32738410496` passed Chromium, Firefox, and WebKit on implementation head "
              "`e81aacafac80de3542ce1c466de8b8df2434bfce`. Merge state, Pages publication, and live-edge content remain separate proof states under invariant 10."
          )
          current_visual = "\n".join([
              "- Visual-coverage PR #47 merged at `3801b500c08c3842c3a54445db503610eac92200`, completing source-backed local image coverage for all 127 authored top-level records while preserving 138 observed-xref `mentions` edges and adding no new media binaries.",
              "- Pages proof-hardening PR #48 merged at `be9bc848788e1a6e3972a615f050a5f2d10a9d59`, making visual-coverage publication proof exact-commit and semantic rather than generic-marker based.",
              "- Pages source-delta PR #50 merged at `acf7a97b9872d6baf9d6c40f1fca03401671c263`, preserving exact source-change publication proof while skipping redundant legacy rebuild requests for workflow-only changes.",
              "- Source-of-truth graph PR #52 merged at `48efb542b198383e9aaf3f55cedc6d66a0bb532b`; `src/system/derivation-map.json` now maps major authority/evidence groups, build generators, generated roots, and validation gates with deterministic projection/validation.",
              "- Build-provenance PR #53 merged at `c91bfa0231982314edfb241ca10c38b94807ed51`; main CI run `33043525693` passed and Build Provenance run `33043645726` generated, reverified, boundary-checked, and uploaded the first exact-commit attestation for that merge.",
              "- Operational State freshness sentinel is implemented on branch `uplift/operational-state-sentinel`; merge and post-merge main proof remain pending and must not be inferred from branch implementation.",
          ])
          if stale_visual not in state:
              raise SystemExit('expected stale PR #47 baseline line not found')
          state = state.replace(stale_visual, current_visual, 1)

          invariant_anchor = "\n## Visual coverage completion — VERIFIED ON PR #47\n"
          invariant = (
              "\n75. `OPERATIONAL_STATE.md` must close every state-relevant repository change in the same change set with an increased revision and matching revision-log entry. "
              "`src/system/operational-state-policy.json` defines the bounded material/exemption policy; `tools/check_operational_state_freshness.py` is read-only and must not auto-edit project state.\n"
          )
          if invariant_anchor not in state:
              raise SystemExit('visual coverage section anchor not found for invariant 75')
          state = state.replace(invariant_anchor, invariant + invariant_anchor, 1)

          known_old = "- The Relationship Observatory exposes the current 136 observed xref `mentions` edges with source/evidence traceability, but no stronger semantic relationship authority exists; semantic meaning remains unauthored unless a later explicit authority is added."
          known_new = "- The Relationship Observatory exposes the current 138 observed xref `mentions` edges with source/evidence traceability, but no stronger semantic relationship authority exists; semantic meaning remains unauthored unless a later explicit authority is added."
          if known_old not in state:
              raise SystemExit('expected stale relationship-count limitation not found')
          state = state.replace(known_old, known_new, 1)

          pending_old = "- None. Museum + AI program: Phase 12 of 12 — AI Agent Evaluation Harness and Final Integration is complete, including the final root-integration repair (PR #42) that made the unified museum shell the visible public entrance. There is no Phase 13."
          pending_new = "- Museum + AI program remains complete at Phase 12 of 12; there is no Phase 13. The post-program Operational State freshness sentinel is implemented on `uplift/operational-state-sentinel`; PR/merge/post-merge main proof is pending and remains a separate proof state."
          if pending_old not in state:
              raise SystemExit('expected Pending baseline not found')
          state = state.replace(pending_old, pending_new, 1)

          revision20 = "- Revision 20: completed Museum + AI Phase 12, both parts."
          if revision20 not in state:
              raise SystemExit('revision 20 log entry not found')
          additions = "\n".join([
              "- Revision 21: closed the post-Phase-12 visual-coverage publication gap. PR #47 merged at `3801b500c08c3842c3a54445db503610eac92200` with source-backed visual coverage for all 127 authored records and 138 observed-xref relationships preserved; PR #48 merged at `be9bc848788e1a6e3972a615f050a5f2d10a9d59` to make Pages proof exact-commit and semantic; PR #50 merged at `acf7a97b9872d6baf9d6c40f1fca03401671c263` to skip redundant legacy rebuilds for workflow-only changes while retaining strict source-change/live proof.",
              "- Revision 22: reconciled the ledger to current `main` through `c91bfa0231982314edfb241ca10c38b94807ed51`, recording source-of-truth graph PR #52 and build-provenance PR #53 plus successful main/provenance evidence; added the bounded read-only Operational State freshness contract, policy, checker, CI gate, regression coverage, and derivation-graph integration on `uplift/operational-state-sentinel`. Merge and post-merge main proof remain pending.",
          ])
          if "- Revision 21:" in state or "- Revision 22:" in state:
              raise SystemExit('revision 21/22 entries already exist unexpectedly')
          state = state.rstrip() + "\n" + additions + "\n"
          state_path.write_text(state, encoding='utf-8')

          graph_path = root / 'src/system/derivation-map.json'
          graph = json.loads(graph_path.read_text(encoding='utf-8'))
          nodes = graph['nodes']
          edges = graph['edges']
          by_id = {node['id']: node for node in nodes}
          if any(node_id in by_id for node_id in ('operational_state', 'ci', 'state_freshness')):
              raise SystemExit('Operational State topology nodes already exist unexpectedly')

          topology = by_id['topology']
          for path in ('src/system/operational-state-policy.json', 'src/system/OPERATIONAL_STATE_FRESHNESS.md'):
              if path not in topology['paths']:
                  topology['paths'].append(path)

          nodes.extend([
              {
                  'id': 'operational_state',
                  'label': 'operational_state',
                  'role': 'authoritative',
                  'node_type': 'source',
                  'paths': ['OPERATIONAL_STATE.md'],
                  'scope': 'operational_state',
              },
              {
                  'id': 'ci',
                  'label': 'ci',
                  'role': 'authoritative',
                  'node_type': 'orchestrator',
                  'paths': ['.github/workflows/ci.yml'],
                  'scope': 'ci',
              },
              {
                  'id': 'state_freshness',
                  'label': 'state_freshness',
                  'role': 'authoritative',
                  'node_type': 'validator',
                  'paths': ['tools/check_operational_state_freshness.py'],
                  'scope': 'state_freshness',
              },
          ])
          edges.extend([
              {
                  'id': 'operational_state_freshness',
                  'from': 'operational_state',
                  'to': 'state_freshness',
                  'kind': 'input_to',
                  'evidence': ['OPERATIONAL_STATE.md', 'tools/check_operational_state_freshness.py'],
              },
              {
                  'id': 'topology_state_freshness',
                  'from': 'topology',
                  'to': 'state_freshness',
                  'kind': 'input_to',
                  'evidence': ['src/system/operational-state-policy.json', 'tools/check_operational_state_freshness.py'],
              },
              {
                  'id': 'ci_state_freshness',
                  'from': 'ci',
                  'to': 'state_freshness',
                  'kind': 'invokes',
                  'evidence': ['.github/workflows/ci.yml', 'tools/check_operational_state_freshness.py'],
              },
          ])
          graph_path.write_text(json.dumps(graph, separators=(',', ':')) + '\n', encoding='utf-8')

          authority_path = root / 'src/system/AUTHORITY.md'
          authority = authority_path.read_text(encoding='utf-8')
          old_coverage = "- the source-of-truth graph validator itself."
          new_coverage = "- the source-of-truth graph validator itself;\n- the CI-enforced Operational State freshness policy and read-only validator."
          if old_coverage not in authority:
              raise SystemExit('system authority coverage anchor not found')
          authority = authority.replace(old_coverage, new_coverage, 1)
          authority_path.write_text(authority, encoding='utf-8')
          PY

          python3 tools/validate_derivation_map.py --write-projection
          python3 tools/check_operational_state_freshness.py
          git diff --check

      - name: Commit deterministic ledger repairs to work branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPERATIONAL_STATE.md src/system/AUTHORITY.md src/system/derivation-map.json src/system/DERIVATION_GRAPH.md
          git commit -m "Reconcile Operational State and topology for freshness sentinel"
          git push origin HEAD:uplift/operational-state-sentinel
