name: One-shot Drakken visual baseline refresh

on:
  push:
    branches:
      - fix/drakken-section

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/drakken-section
          fetch-depth: 0

      - name: Trust worktree
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Prove deterministic publication before visual refresh
        run: ./tools/build.sh --check

      - name: Refresh only the two intentional visual references
        env:
          UPDATE_VISUAL_BASELINES: "1"
        run: >-
          python3 -m pytest -q
          tests/test_dossier.py::test_visual_peripheral_entry
          tests/test_dossier.py::test_visual_media_vault

      - name: Recheck refreshed visual references normally
        run: >-
          python3 -m pytest -q
          tests/test_dossier.py::test_visual_peripheral_entry
          tests/test_dossier.py::test_visual_media_vault

      - name: Full Chromium regression suite
        run: python3 -m pytest tests/ -q

      - name: Commit refreshed baselines and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-drakken-visual-baselines.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check -- ':(exclude)tests/visual_baselines/*.png'
          git status --short
          git commit -m "Refresh Drakken regrouping visual baselines"
          git push origin HEAD:fix/drakken-section
