name: Apply archive copy prompt stable identity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/archive-copy-prompt-stable-id

      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Preflight current archive identity contract
        shell: bash
        run: |
          cat > tests/test_archive_identity_preflight.py <<'PYTEST'
          from playwright.sync_api import Page

          def test_current_archive_slots_have_stable_identity(page: Page, local_server):
              page.goto(f"{local_server}/index.html")
              stages = page.locator(".attachment-stage")
              assert stages.count() == 26
              identities = stages.evaluate_all("els => els.map(el => ({key: el.closest('[data-asset-key]')?.getAttribute('data-asset-key') || '', number: el.querySelector('.asset-number')?.textContent.trim() || ''}))")
              keys = [item['key'] for item in identities]
              assert len(keys) == len(set(keys)) == 26
              assert all(keys)
              target = page.locator('[data-asset-key="asset-19"] .attachment-stage')
              assert target.count() == 1
              assert target.evaluate("el => el.querySelector('.asset-number')?.textContent.trim()") == "19"
          PYTEST
          python3 -m pytest tests/test_archive_identity_preflight.py -q
          rm tests/test_archive_identity_preflight.py

      - name: Prepare implementation block
        shell: bash
        run: |
          cat > /tmp/archive_prompt_block.js <<'JS'
            function collectLocalArchiveChanges(){
              var changes = [];
              stages.forEach(function(stage){
                var initial = initialStageState.get(stage);
                if(!initial) return;
                var img = stage.querySelector('img');
                var currentSrc = img ? (img.getAttribute('src') || '') : '';
                var currentHidden = img ? img.hidden : true;
                if(currentSrc === initial.src && currentHidden === initial.hidden) return;
                var meta = localFileMeta.get(stage) || null;
                var currentVisible = !!(currentSrc && !currentHidden);
                var initialVisible = !!(initial.src && !initial.hidden);
                changes.push({
                  slot: initial.slot,
                  asset_key: initial.asset_key || null,
                  title: initial.title,
                  identity_status: initial.asset_key ? 'stable' : 'missing',
                  action: currentVisible ? (initialVisible ? 'replace' : 'attach') : 'clear',
                  local_file: meta ? {name: meta.name, type: meta.type, bytes: meta.bytes} : null,
                  initial_src: initial.src || null
                });
              });
              return changes;
            }

            function buildImplementationPrompt(changes){
              var manifest = JSON.stringify(changes, null, 2);
              var unresolved = changes.filter(function(change){ return !change.asset_key; });
              return [
                'Implement my browser-local Archive Tools changes in the Starsilk Compendium repository.',
                '',
                'Repository: https://github.com/westkitty/Starsilk_Character_Dossier',
                'Target production branch: main',
                '',
                'REALITY / AUTHORITY RULES',
                '- Inspect the current repository state before editing. Do not assume this prompt is newer than main.',
                '- Preserve the deterministic authority flow: src/content/ + src/templates/ -> build/generate.py -> docs/index.html -> build/validate.py.',
                '- Do not hand-edit docs/index.html as authoritative source.',
                '- Preserve src/canon/invariants.json as the canon-lock authority and docs/asset-manifest.json as published-media provenance.',
                '- Archive Tools are browser-local maintenance controls. This prompt is a handoff request, not evidence that GitHub was already changed.',
                '- Every changed legacy slot must retain the stable asset_key listed in the manifest. Never substitute DOM position for that identity.',
                '',
                'LOCAL CHANGE MANIFEST',
                manifest,
                '',
                'REQUIRED LOCAL EVIDENCE',
                '- I must also attach the locally exported starsilk_character_dossier_copy.html from Archive Tools, or the original local image files named in the manifest. The exported HTML is evidence only, not canonical source.',
                '- The export contains locally attached images as data URIs. If the export/files are missing or a listed change cannot be recovered from them, stop and ask me for the missing evidence. Do not fabricate media or infer unseen edits.',
                '- If any manifest item has identity_status "missing" or no asset_key, do not implement that item. Stop and report the unresolved identity.',
                '- Treat only the manifest plus supplied local export/files as authorization for local Archive Tools changes. Preserve unrelated canon, prose, media, layout, behavior, and infrastructure.',
                '',
                'IMPLEMENTATION TASK',
                '1. Compare the supplied local export against the current generated site and identify only the manifest-listed Archive Tools changes.',
                '2. Resolve every change by its stable asset_key and title, then map it back to authoritative source files and the existing media/provenance pipeline. Do not target a slot only by ordinal DOM position.',
                '3. Do not commit data-URI images as the final media architecture. If canonical original media changes, preserve the external media/source recovery model and do not claim durable recovery is complete unless that obligation is actually satisfied.',
                '4. Rebuild generated output from authoritative sources and run the canon/build validators plus relevant browser regression tests.',
                '5. Inspect the final diff and verify that only authorized changes and required generated/provenance outputs changed.',
                '6. Stage only the intended files, commit with a descriptive message, and push. If a branch/PR is required, complete that path so the verified result lands on main.',
                '7. Report the final commit SHA, files changed, validation results, and any evidence or backup obligation that remains unverified.',
                '',
                unresolved.length ? 'BLOCKED: ' + unresolved.length + ' changed slot(s) lack stable asset identity. Do not implement them.' : ('Detected browser-local Archive Tools changes: ' + changes.length + '.')
              ].join('\n');
            }

            function fallbackCopyText(text){
              return new Promise(function(resolve, reject){
                var field = document.createElement('textarea');
                field.value = text;
                field.setAttribute('readonly', '');
                field.style.position = 'fixed';
                field.style.opacity = '0';
                document.body.appendChild(field);
                field.select();
                var copied = false;
                try { copied = document.execCommand('copy'); } catch(e){}
                field.remove();
                if(copied) resolve();
                else reject(new Error('Clipboard copy was not permitted by this browser.'));
              });
            }

            function copyPlainText(text){
              if(navigator.clipboard && typeof navigator.clipboard.writeText === 'function'){
                return navigator.clipboard.writeText(text).catch(function(){ return fallbackCopyText(text); });
              }
              return fallbackCopyText(text);
            }

            if(copyPromptBtn){
              copyPromptBtn.addEventListener('click', function(){
                var changes = collectLocalArchiveChanges();
                var prompt = buildImplementationPrompt(changes);
                copyPlainText(prompt).then(function(){
                  if(copyPromptStatus) copyPromptStatus.textContent = 'Implementation prompt copied. ' + changes.length + ' local change' + (changes.length === 1 ? '' : 's') + ' detected.';
                  copyPromptBtn.textContent = 'Prompt copied';
                  setTimeout(function(){ copyPromptBtn.textContent = 'Copy implementation prompt'; }, 1800);
                }).catch(function(){
                  if(copyPromptStatus) copyPromptStatus.textContent = 'Could not copy the implementation prompt. Check clipboard permission and try again.';
                });
              });
            }

          JS

      - name: Apply bounded source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          shell_path = Path('src/templates/shell.html.j2')
          shell = shell_path.read_text(encoding='utf-8')
          old = '<button type="button" id="modeToggle" aria-pressed="false" hidden>Archive tools</button><div class="page-controls-search">'
          new = '<button type="button" id="modeToggle" aria-pressed="false" hidden>Archive tools</button><button type="button" id="copyImplementationPrompt" hidden>Copy implementation prompt</button><span id="copyPromptStatus" class="visually-hidden" role="status" aria-live="polite"></span><div class="page-controls-search">'
          shell = replace_once(shell, old, new, 'copy prompt top control')
          shell_path.write_text(shell, encoding='utf-8')

          app_path = Path('src/templates/app.js')
          app = app_path.read_text(encoding='utf-8')
          app = replace_once(
              app,
              "  var modeToggle = document.getElementById('modeToggle');\n",
              "  var modeToggle = document.getElementById('modeToggle');\n  var copyPromptBtn = document.getElementById('copyImplementationPrompt');\n  var copyPromptStatus = document.getElementById('copyPromptStatus');\n",
              'copy prompt control lookup',
          )
          app = replace_once(
              app,
              "      modeToggle.hidden = !on;\n",
              "      modeToggle.hidden = !on;\n      if(copyPromptBtn) copyPromptBtn.hidden = !on;\n      if(!on && copyPromptStatus) copyPromptStatus.textContent = '';\n",
              'copy prompt archive visibility',
          )
          identity_block = """  var localFileMeta = new WeakMap();
          var initialStageState = new WeakMap();
          stages.forEach(function(stage, index){
            var record = stage.closest('[data-asset-key]');
            var numberEl = stage.querySelector('.asset-number');
            var titleEl = record ? record.querySelector('figcaption b') : null;
            var img = stage.querySelector('img');
            initialStageState.set(stage, {
              slot: numberEl ? numberEl.textContent.trim() : String(index + 1),
              asset_key: record ? (record.getAttribute('data-asset-key') || '') : '',
              title: titleEl ? titleEl.textContent.trim() : (stage.getAttribute('aria-label') || '').replace(/^Attach image for /, ''),
              src: img ? (img.getAttribute('src') || '') : '',
              hidden: img ? img.hidden : true
            });
          });
          """
          identity_block = '\n'.join(line[10:] if line.startswith('          ') else line for line in identity_block.splitlines()) + '\n'
          app = replace_once(
              app,
              "  var ACCEPTED_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];\n",
              "  var ACCEPTED_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];\n" + identity_block,
              'stable archive identity map',
          )
          app = replace_once(
              app,
              "    clearInlineError(stage);\n    var reader = new FileReader();",
              "    clearInlineError(stage);\n    localFileMeta.set(stage, {name: file.name || '', type: file.type || '', bytes: file.size || 0});\n    var reader = new FileReader();",
              'local file metadata capture',
          )
          app = replace_once(
              app,
              "        if(input) input.value = '';\n        clearInlineError(stage);",
              "        if(input) input.value = '';\n        localFileMeta.delete(stage);\n        clearInlineError(stage);",
              'local file metadata clear',
          )
          prompt_js = Path('/tmp/archive_prompt_block.js').read_text(encoding='utf-8')
          app = replace_once(
              app,
              "  window.addEventListener('beforeunload', function(e){\n",
              prompt_js + "  window.addEventListener('beforeunload', function(e){\n",
              'copy implementation prompt behavior',
          )
          app = replace_once(
              app,
              "      clone.querySelectorAll('.asset-file, .attachment-error, #clearImages, #exportEmbedded').forEach(function(n){ n.remove(); });",
              "      clone.querySelectorAll('.asset-file, .attachment-error, #clearImages, #exportEmbedded, #copyImplementationPrompt, #copyPromptStatus').forEach(function(n){ n.remove(); });",
              'export strips copy prompt controls',
          )
          app_path.write_text(app, encoding='utf-8')
          PY

      - name: Add permanent focused regression tests
        shell: bash
        run: |
          cat > tests/test_archive_prompt.py <<'PYTEST'
          import base64

          from playwright.sync_api import Page, expect

          PNG_1X1 = base64.b64decode(
              'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M/wHwAF/gL+R2slWQAAAABJRU5ErkJggg=='
          )

          def unlock(page: Page, local_server: str):
              page.goto(f'{local_server}/index.html')
              page.locator('#dossierSearch').fill('ajd')
              expect(page.locator('#modeToggle')).to_be_visible()

          def test_archive_prompt_control_is_session_only(page: Page, local_server):
              page.goto(f'{local_server}/index.html')
              copy_btn = page.locator('#copyImplementationPrompt')
              expect(copy_btn).to_be_hidden()
              page.locator('#dossierSearch').fill('ajd')
              expect(copy_btn).to_be_visible()
              expect(copy_btn).to_have_text('Copy implementation prompt')
              page.locator('#modeToggle').click()
              expect(copy_btn).to_be_hidden()
              page.reload()
              expect(copy_btn).to_be_hidden()

          def test_all_archive_slots_have_unique_stable_identity(page: Page, local_server):
              page.goto(f'{local_server}/index.html')
              stages = page.locator('.attachment-stage')
              assert stages.count() == 26
              identities = stages.evaluate_all("els => els.map(el => ({key: el.closest('[data-asset-key]')?.getAttribute('data-asset-key') || '', number: el.querySelector('.asset-number')?.textContent.trim() || ''}))")
              assert len({item['key'] for item in identities}) == 26
              assert all(item['key'] for item in identities)
              target = page.locator('[data-asset-key="asset-19"] .attachment-stage')
              assert target.count() == 1
              assert target.evaluate("el => el.querySelector('.asset-number')?.textContent.trim()") == '19'

          def test_copy_prompt_binds_change_to_asset_key_and_export_carries_media(page: Page, local_server, tmp_path):
              page.context.grant_permissions(['clipboard-read', 'clipboard-write'], origin=local_server)
              unlock(page, local_server)
              test_img = tmp_path / 'handoff-test.png'
              test_img.write_bytes(PNG_1X1)
              target_stage = page.locator('[data-asset-key="asset-19"] .attachment-stage')
              target_stage.locator('.asset-file').set_input_files(str(test_img))
              expect(page.locator('#assetStatus')).to_contain_text('1 of 26')

              page.locator('#copyImplementationPrompt').click()
              expect(page.locator('#copyPromptStatus')).to_contain_text('Implementation prompt copied')
              prompt = page.evaluate('navigator.clipboard.readText()')
              assert '"slot": "19"' in prompt
              assert '"asset_key": "asset-19"' in prompt
              assert '"title": "Administration allocation facility"' in prompt
              assert '"identity_status": "stable"' in prompt
              assert '"action": "attach"' in prompt
              assert '"name": "handoff-test.png"' in prompt
              assert 'starsilk_character_dossier_copy.html' in prompt
              assert 'Do not hand-edit docs/index.html' in prompt
              assert 'Never substitute DOM position for that identity' in prompt
              assert 'Stage only the intended files' in prompt
              assert 'commit with a descriptive message' in prompt
              assert 'push' in prompt
              assert 'lands on main' in prompt
              assert 'BLOCKED:' not in prompt

              page.evaluate("document.querySelectorAll('details.page-disclosure').forEach(d => d.open = true)")
              with page.expect_download() as download_info:
                  page.locator('#exportEmbedded').click()
              export_path = tmp_path / 'starsilk_character_dossier_copy.html'
              download_info.value.save_as(str(export_path))
              exported = export_path.read_text(encoding='utf-8')
              assert 'data:image/png;base64,' in exported
              assert 'id="copyImplementationPrompt"' not in exported
              assert 'id="copyPromptStatus"' not in exported
          PYTEST

      - name: Build generated site from authoritative sources
        run: ./tools/build.sh

      - name: Verify deterministic deployable output
        run: |
          ./tools/build.sh --check
          git diff --check

      - name: Focused Archive Tools handoff proof
        run: python3 -m pytest tests/test_archive_prompt.py -q

      - name: Full Chromium regression suite
        run: python3 -m pytest tests/ -q

      - name: Firefox representative journeys
        run: HOME=/root python3 -m pytest tests/test_cross_browser.py --browser firefox -q

      - name: WebKit representative journeys
        run: HOME=/root python3 -m pytest tests/test_cross_browser.py --browser webkit -q

      - name: Record verified operational state
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('OPERATIONAL_STATE.md')
          text = path.read_text(encoding='utf-8')
          if 'revision: 7' not in text:
              raise SystemExit('Expected operational-state revision 7 before update')
          text = text.replace('revision: 7', 'revision: 8', 1)
          invariant = '16. Archive implementation handoff prompts must bind every changed legacy slot to its stable `data-asset-key` captured from authoritative archive markup. Browser-local attachment data is evidence, not canonical repo state, and implementation still requires the exported HTML copy or original local files.\n'
          marker = '15. Public Archive Tools remain local-only browser maintenance controls with no repository-write path. They must load locked in Reader mode, require the exact search-field unlock phrase for the current page session, and must not persist an unlocked state across reloads.\n'
          if invariant not in text:
              text = text.replace(marker, marker + invariant, 1)
          verified = f'''\n## Archive implementation prompt handoff — VERIFIED\n\nGitHub Actions run `{os.environ.get('GITHUB_RUN_ID', 'unknown')}` verified the Archive-mode implementation handoff before commit:\n\n- `Copy implementation prompt` is hidden in Reader mode, appears only after the existing exact `ajd` Archive Tools unlock, relocks with Reader mode, and does not persist across reloads.\n- All 26 legacy attachment stages expose unique stable archive identities; the focused proof uses authoritative `asset-19` / slot `19` rather than assuming DOM order.\n- Local attachment changes are bound to identity captured from authoritative archive markup at initialization rather than inferred later from ordinal DOM position.\n- The actual browser clipboard contained the changed-slot manifest with `asset-19`, slot `19`, title `Administration allocation facility`, local filename metadata, and the instruction to validate, stage, commit, push, and land the verified change on `main`.\n- The copied handoff requires the locally exported HTML copy or original image files and explicitly blocks implementation for any changed slot whose stable asset identity is missing.\n- Exported HTML still embeds locally attached images as data URIs for handoff evidence while stripping the maintenance copy-prompt controls.\n- `./tools/build.sh`, `./tools/build.sh --check`, `git diff --check`, focused clipboard/export tests, the full Chromium suite, and representative Firefox/WebKit journeys passed before commit.\n\n'''
          text = text.replace('\n## Known limitations\n', verified + '## Known limitations\n', 1)
          log = '- Revision 8: added the Archive-mode `Copy implementation prompt` handoff, locked changed-slot identity to authoritative `data-asset-key` values, required exported local evidence for implementation, and verified clipboard/export behavior plus full browser regressions before commit.\n'
          text = text.rstrip() + '\n' + log
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit verified change set
        shell: bash
        run: |
          rm .github/workflows/apply-archive-copy-prompt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/templates/shell.html.j2 src/templates/app.js docs/index.html docs/qa-report.txt tests/test_archive_prompt.py OPERATIONAL_STATE.md
          git diff --cached --check
          git status --short
          git commit -m "feat: copy archive implementation prompt"
          git push origin HEAD:fix/archive-copy-prompt-stable-id
