name: Codec Wound Graph live proof

on:
  push:
    branches: [feature/codec-wound-graph]
    paths:
      - '.github/workflows/codec-wound-live-proof.yml'

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact published merge
        uses: actions/checkout@v4
        with:
          ref: 62d638143db4b2117a570920c8251b3d2bae37ac
      - name: Prove live Wound Graph byte parity and authority boundaries
        run: |
          set -euo pipefail
          base='https://westkitty.github.io/Starsilk_Character_Dossier'
          stamp="62d638143db4b2117a570920c8251b3d2bae37ac-$(date +%s)"
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${base}/?wound_proof=${stamp}" --output /tmp/live-index.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${base}/wound-graph.js?wound_proof=${stamp}" --output /tmp/live-wound-graph.js
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' "${base}/wound-graph.css?wound_proof=${stamp}" --output /tmp/live-wound-graph.css
          cmp --silent docs/index.html /tmp/live-index.html
          cmp --silent docs/wound-graph.js /tmp/live-wound-graph.js
          cmp --silent docs/wound-graph.css /tmp/live-wound-graph.css
          grep -Fq '<script src="wound-graph.js"></script>' /tmp/live-index.html
          grep -Fq 'Evidence network, not causal authority.' /tmp/live-wound-graph.js
          grep -Fq 'LOCAL ANALYSIS · ZERO CANON AUTHORITY' /tmp/live-wound-graph.js
          grep -Fq 'Not proof of causation.' /tmp/live-wound-graph.js
          grep -Fq 'Canon Ledger order is evidence order, not guaranteed chronology.' /tmp/live-wound-graph.js
          if grep -Fq 'localStorage' /tmp/live-wound-graph.js; then
            echo '::error::Wound Graph unexpectedly references localStorage.'
            exit 1
          fi
          grep -Fq 'min-height:44px' /tmp/live-wound-graph.css
          echo "root_sha256=$(sha256sum /tmp/live-index.html | awk '{print $1}')"
          echo "wound_js_sha256=$(sha256sum /tmp/live-wound-graph.js | awk '{print $1}')"
          echo "wound_css_sha256=$(sha256sum /tmp/live-wound-graph.css | awk '{print $1}')"
          echo 'LIVE CODEC WOUND GRAPH PROOF PASS'
