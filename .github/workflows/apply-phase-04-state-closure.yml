name: Apply Phase 04 state closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  close-state:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch durable roadmap and Operational State
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one replacement target, found {count}")
              return text.replace(old, new, 1)

          roadmap_path = Path("MUSEUM_AI_ROADMAP.md")
          roadmap = roadmap_path.read_text(encoding="utf-8")
          roadmap = replace_once(
              roadmap,
              "| 4 | Museum Object Model and Media Viewer | NOT STARTED | — | begin only in a fresh chat after verifying Phase 3 on current `main` |",
              "| 4 | Museum Object Model and Media Viewer | COMPLETE | PR #18; final head `0603379d0ea6a364e0d5d608685f38b27f95bfc9`; CI `32642262682` PASS; merged `258ce10f9d0d73b22163ae22243b953af99427fc`; live proof `32642574092` PASS | none |",
              "roadmap phase-4 ledger",
          )
          roadmap = replace_once(
              roadmap,
              "| 5 | Relationship Observatory | NOT STARTED | — | deferred |",
              "| 5 | Relationship Observatory | NOT STARTED | — | begin only in a fresh chat after verifying Phase 4 on current `main` |",
              "roadmap phase-5 deferral",
          )
          phase4_contract = "### Phase 4 — Museum Object Model and Media Viewer\n\nPromote existing media identities into provenance-aware museum objects and build an accessible, deep-linkable fullscreen viewer without eager-loading the archive or committing canonical originals. Evaluate static IIIF only if it cleanly fits the static architecture.\n"
          phase4_complete = phase4_contract + """

#### Completion record

- starting `main`: `06c1acaee9bdb1127df7902d702d8d062b62a40c`
- work branch: `phase-04-museum-objects`
- exact generated-publication commit: `bed865afb3195ce972c41b58d4d0eed516a3aa92`
- final validated implementation head: `0603379d0ea6a364e0d5d608685f38b27f95bfc9`
- successful one-shot generation/focused proof: run `32642163782`, job `97200820702`
- successful required final CI: `32642262682`
- implementation repair passes used: zero
- implementation PR: `#18`
- implementation merge on `main`: `258ce10f9d0d73b22163ae22243b953af99427fc`
- execution-only live proof PR: `#19`, closed unmerged
- successful live proof: run `32642574092`, job `97201827679`
- museum object register: 213 records, exactly matching the 213 existing `docs/asset-manifest.json` published-media entries
- stable object identity: `object_id` is the published filename with only its final extension removed; the complete filename remains the provenance source key
- generated public museum surface: six `docs/objects/` text/code files (`index.html`, `museum.css`, `museum.js`, `objects.json`, `schema.json`, `AUTHORITY.md`); no media binaries are copied into the museum tree
- human deep links: `/objects/#<object-id>`; the base register loads metadata only and creates exactly one media element only after selection/deep-link
- viewer behavior: native dialog, keyboard/Escape closure, previous/next navigation, optional user-triggered browser fullscreen, controlled image/video rendering, no video autoplay, and media teardown on close
- provenance semantics: `logical_identity`, `match_status`, provenance, and section context remain descriptive manifest evidence and never replace object identity or create stronger relationship/canon claims
- explicit unknowns are preserved when logical identity, context, or authored alt text is absent
- entity index now exposes a human `Browse museum objects` entry point; existing entity records, stable IDs, and legacy Compendium anchors remain unchanged
- static IIIF was evaluated and deliberately not adopted because current requirements need neither tiled deep zoom, region annotation, nor IIIF interoperability; adding it would create unnecessary derivative/distribution infrastructure
- first live-browser proof attempt used one brittle immediate text assertion after the dialog opened; only the read-only proof harness was changed to Playwright retry-aware assertions, with no product mutation, and the full rerun passed
- live proof established `LIVE_PHASE4_BYTES_OK objects=213 exact_files=9 identity=ok provenance=ok unknowns=ok root=ok`
- live browser proof established `LIVE_PHASE4_BROWSER_OK metadata_only=ok image=ok video=ok escape=ok teardown=ok discovery=ok`
- live downloaded Phase 4 surfaces passed `tools/check_public_boundary.py`
- Phase 4 did not modify root Compendium content, canon sources, `docs/asset-manifest.json`, `docs/assets/media/`, `media/source/`, dependencies, Phase 3 stable identities, or Phase 5 relationship semantics

**Completion verdict: VERIFIED.**
"""
          roadmap = replace_once(roadmap, phase4_contract, phase4_complete, "roadmap phase-4 completion record")
          roadmap_path.write_text(roadmap, encoding="utf-8")

          state_path = Path("OPERATIONAL_STATE.md")
          state = state_path.read_text(encoding="utf-8")
          state = replace_once(state, "revision: 11", "revision: 12", "state revision")
          state = replace_once(
              state,
              "- Museum + AI Phase 3 PR #15 merged at `b7726adc86f967e914616c07b5b4b6179236dbf3`.\n",
              "- Museum + AI Phase 3 PR #15 merged at `b7726adc86f967e914616c07b5b4b6179236dbf3`.\n- Museum + AI Phase 4 PR #18 merged at `258ce10f9d0d73b22163ae22243b953af99427fc`.\n",
              "state baseline phase-4 merge",
          )
          state = replace_once(
              state,
              "- Per-record machine alternatives are `/machine/entities/<stable-id>.json` and `/machine/entities/<stable-id>.md`, keyed by the same existing stable IDs.\n",
              "- Per-record machine alternatives are `/machine/entities/<stable-id>.json` and `/machine/entities/<stable-id>.md`, keyed by the same existing stable IDs.\n- `build/museum_publication.py` owns deterministic generation of `docs/objects/`; the museum object register is a public derivative of `docs/asset-manifest.json`, not a second canon or media-provenance authority.\n- The museum human surface is `/objects/`; individual museum deep links are `/objects/#<object-id>`.\n- `src/museum/AUTHORITY.md` and `src/schema/museum-object-index.schema.json` define the Phase 4 object/publication interpretation contract.\n",
              "state baseline phase-4 publication surfaces",
          )
          state = replace_once(
              state,
              "33. Generated entity pages must remain static and accessible with no executable JavaScript beyond inert JSON-LD; the complete root Compendium remains the legacy all-in-one destination and its stable anchors must not be removed.\n",
              "33. Generated entity pages must remain static and accessible with no executable JavaScript beyond inert JSON-LD; the complete root Compendium remains the legacy all-in-one destination and its stable anchors must not be removed.\n34. `docs/asset-manifest.json` remains the published-media provenance ledger. A Phase 4 museum `object_id` is the published media filename with only the final extension removed; the complete filename remains its provenance source key.\n35. `logical_identity`, `match_status`, provenance, and section contexts are descriptive manifest evidence. They must not replace museum identity, become canon-status fields, or imply stronger semantic relationships.\n36. Missing museum description/context evidence remains explicit unknown state. Do not infer logical identity, alt text, provenance, or relationships from filenames, imagery, adjacent lore, or presentation order.\n37. `docs/objects/` is generator-owned output from `build/museum_publication.py`. Its current generated surface is six text/code files and must not contain copied media binaries or hand-authored canon prose.\n38. `/objects/` must load the 213-record metadata register without requesting `/assets/media/` bytes. Media is on-demand: one selected/deep-linked object creates one media element only.\n39. Museum videos must use user controls, metadata-only preload, and no autoplay. Closing the viewer must pause/unset/remove selected media so playback or downloading does not continue invisibly.\n40. Museum object deep links use `/objects/#<object-id>`. They are stable client-side fragment destinations over one static human museum page, not separate server-side HTML resources.\n41. Museum section contexts prove published placement only and may link to canonical entity pages; they do not establish Phase 5 relationship semantics.\n42. Phase 4 consumes existing `docs/assets/media/` derivatives as-is and must not regenerate, replace, commit, or claim new backup coverage for canonical originals in `media/source/`.\n43. Static IIIF is deliberately not adopted in Phase 4. Re-evaluate only if a later requirement needs tiled deep zoom, region-level annotation, or IIIF interoperability strongly enough to justify new derivative infrastructure.\n44. Public museum derivatives must remain reproducible from the manifest/schema/templates, pass `tools/check_public_boundary.py`, and receive independent live Pages verification whenever the museum publication changes.\n",
              "state phase-4 invariants",
          )
          phase3_end = "Therefore Phase 3 is **VERIFIED COMPLETE** at repository, CI, merge, permalink, legacy-compatibility, and live-publication layers.\n\n## GitHub Pages deployment state — VERIFIED"
          phase4_state = """Therefore Phase 3 is **VERIFIED COMPLETE** at repository, CI, merge, permalink, legacy-compatibility, and live-publication layers.

## Museum + AI Phase 4 museum object model and media viewer — VERIFIED

Phase 4 of 12, **Museum Object Model and Media Viewer**, is complete.

Repository evidence:

- starting `main`: `06c1acaee9bdb1127df7902d702d8d062b62a40c`
- work branch: `phase-04-museum-objects`
- exact generated-publication commit: `bed865afb3195ce972c41b58d4d0eed516a3aa92`
- final validated implementation head: `0603379d0ea6a364e0d5d608685f38b27f95bfc9`
- one-shot generation/focused proof: run `32642163782`, job `97200820702`
- successful final CI: run `32642262682`
- implementation repair passes used: zero
- implementation PR: `#18`
- merged to `main`: `258ce10f9d0d73b22163ae22243b953af99427fc`

Phase 4 verified capabilities:

- `build/museum_publication.py` deterministically generates/checks the complete `docs/objects/` publication from `docs/asset-manifest.json`.
- the museum register contains exactly 213 records, one for every existing published-media manifest entry.
- museum `object_id` is derived only by removing the final extension from the published filename; the complete filename remains the manifest provenance identity/source key.
- `logical_identity`, `match_status`, provenance, and context are preserved exactly as descriptive evidence rather than promoted into new identity, canon, or relationship authority.
- missing logical identity, context, or authored alt evidence is represented explicitly in `unknowns` rather than inferred.
- `/objects/` is a responsive human museum register with stable `/objects/#<object-id>` fragment deep links.
- initial collection load is metadata-only and makes no `/assets/media/` request; selected objects create one media element on demand.
- image and MP4 objects share the same model; video uses controls, `preload=metadata`, never autoplays, and is removed/cleared when the viewer closes.
- the viewer uses native `<dialog>` semantics with keyboard/Escape closure, previous/next navigation, focus handling, responsive layout, and optional user-triggered Fullscreen API entry.
- `docs/objects/objects.json`, `schema.json`, and generated `AUTHORITY.md` provide source-backed machine/interpretation surfaces without duplicating canon prose.
- the entity index exposes `Browse museum objects`; individual Phase 3 entity pages and their stable identities were not rewritten.
- the generated museum tree contains no media binaries and consumes existing `docs/assets/media/` files as-is.
- canonical originals in `media/source/` remain outside Git and unchanged.
- static IIIF was evaluated and deliberately rejected for this phase because no current deep-zoom, region-annotation, or interoperability requirement justifies tile/derivative infrastructure.
- root Compendium content, canon sources, `docs/asset-manifest.json`, published media bytes, dependencies, Archive Tools, and Phase 5 semantic relationship scope were not changed.

Final CI run `32642262682` on head `0603379d0ea6a364e0d5d608685f38b27f95bfc9` passed:

- authoritative source build;
- deterministic committed `docs/` parity including museum publication;
- strict existing DOM/canon validation;
- public derivative boundary validation;
- `git diff --check`;
- full Chromium pytest + Playwright suite, including Phase 4 object/viewer tests;
- representative Firefox journeys including museum deep-link/Escape behavior;
- representative WebKit journeys including museum deep-link/Escape behavior.

Live publication was independently verified by execution-only PR #19, closed without merge after proof. The first browser-proof attempt had already proven all exact live bytes and the public boundary, then failed on a single immediate `inner_text()` equality assertion after the live dialog had opened. The read-only proof harness was changed to Playwright retry-aware assertions; no product bytes changed. GitHub Actions run `32642574092`, job `97201827679`, then established:

- `LIVE_PHASE4_BYTES_OK objects=213 exact_files=9 identity=ok provenance=ok unknowns=ok root=ok`;
- the changed museum files, entity index, root Compendium, and source asset manifest were byte-identical to merged repository authority at the Pages edge;
- all 213 live object IDs were unique and exactly followed the filename-stem identity rule;
- live provenance/context evidence and explicit unknowns remained source-backed and unpromoted;
- the downloaded live text/object surfaces passed `tools/check_public_boundary.py`;
- `LIVE_PHASE4_BROWSER_OK metadata_only=ok image=ok video=ok escape=ok teardown=ok discovery=ok`;
- live `/objects/` rendered 213 records without eager media requests;
- a live image deep link opened one image, preserved its entity context, and Escape removed the media/cleared the fragment;
- a live video deep link created one controlled, paused, non-autoplaying metadata-preload video and close removed it;
- the live entity index exposed the museum discovery link.

Therefore Phase 4 is **VERIFIED COMPLETE** at authority, identity, generation, browser, CI, merge, provenance, source-boundary, and live-publication layers.

## GitHub Pages deployment state — VERIFIED"""
          state = replace_once(state, phase3_end, phase4_state, "state phase-4 verified section")
          state = replace_once(
              state,
              "- Phase 3 does not create museum-object identities, fullscreen viewer semantics, or IIIF surfaces; those remain Phase 4 work.\n",
              "- Phase 4 museum deep links are fragment routes over one static `/objects/` document, not separate server-side HTML resources.\n- Static IIIF is not part of the current publication; it remains a future option only if later requirements justify tile/deep-zoom/interoperability infrastructure.\n- Phase 4 context links preserve published placement evidence only; richer relationship semantics remain unauthored and belong to Phase 5.\n",
              "state phase-4 known limitations",
          )
          state = replace_once(
              state,
              "- Museum + AI program: Phase 4 of 12 — Museum Object Model and Media Viewer. It must begin only in a fresh chat after re-reading `MUSEUM_AI_ROADMAP.md`, this Operational State, current `main`, and relevant CI/publication state.\n",
              "- Museum + AI program: Phase 5 of 12 — Relationship Observatory. It must begin only in a fresh chat after re-reading `MUSEUM_AI_ROADMAP.md`, this Operational State, current `main`, and relevant CI/publication state.\n",
              "state pending phase",
          )
          revision11 = "- Revision 11: completed Museum + AI Phase 3. Added 127 canonical human `/entities/<stable-id>/` pages, the entity index, 254 per-record JSON/Markdown alternatives, manifest-backed related media, observed-xref related-record lists, canonical URL migration, static accessible entity templates, deterministic entity generation/checking, and legacy-anchor preservation. One bounded repair protected the authored `archive` permalink from the repo-wide `archive/` ignore rule. PR #15 passed final Chromium/Firefox/WebKit CI and merged at `b7726adc86f967e914616c07b5b4b6179236dbf3`; exhaustive live proof run `32640932505` verified 396 declared URLs byte-for-byte and proof PR #16 was closed unmerged.\n"
          revision12 = revision11 + "- Revision 12: completed Museum + AI Phase 4. Added a deterministic 213-record manifest-derived museum object model, stable filename-stem object IDs, explicit provenance/unknown semantics, `/objects/` metadata register, on-demand accessible image/video dialog viewer, hash deep links, entity-index discovery, schema/authority publication, build integration, and regression coverage. No implementation repair pass was needed. PR #18 passed final Chromium/Firefox/WebKit CI and merged at `258ce10f9d0d73b22163ae22243b953af99427fc`; live proof run `32642574092` verified exact Pages bytes plus metadata-only/image/video/teardown behavior, and proof PR #19 was closed unmerged. Static IIIF was evaluated and not adopted.\n"
          state = replace_once(state, revision11, revision12, "state revision log")
          state_path.write_text(state, encoding="utf-8")

          # Closure assertions: Phase 4 is complete; Phase 5 is not started.
          roadmap_check = roadmap_path.read_text(encoding="utf-8")
          state_check = state_path.read_text(encoding="utf-8")
          assert "| 4 | Museum Object Model and Media Viewer | COMPLETE |" in roadmap_check
          assert "| 5 | Relationship Observatory | NOT STARTED |" in roadmap_check
          assert "revision: 12" in state_check
          assert "## Museum + AI Phase 4 museum object model and media viewer — VERIFIED" in state_check
          assert "Phase 5 of 12 — Relationship Observatory" in state_check
          assert "LIVE_PHASE4_BROWSER_OK" in state_check
          PY

      - name: Enforce state-only closure scope
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(MUSEUM_AI_ROADMAP\.md|OPERATIONAL_STATE\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::State closure changed an unauthorized path:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git add MUSEUM_AI_ROADMAP.md OPERATIONAL_STATE.md
          git rm .github/workflows/apply-phase-04-state-closure.yml
          staged="$(git diff --cached --name-only)"
          unexpected_staged="$(printf '%s\n' "$staged" | grep -Ev '^(MUSEUM_AI_ROADMAP\.md|OPERATIONAL_STATE\.md|\.github/workflows/apply-phase-04-state-closure\.yml)$' || true)"
          if [ -n "$unexpected_staged" ]; then
            echo "::error::Unexpected staged closure path:"
            printf '%s\n' "$unexpected_staged"
            exit 1
          fi

      - name: Commit verified Phase 04 state closure and retire this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(phase-04): record verified museum completion"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
