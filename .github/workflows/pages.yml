name: Publish Compendium to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "index.html"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  inspect-pages-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read current GitHub Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --output /tmp/pages.json
          python3 - <<'PY'
          import json

          with open('/tmp/pages.json', encoding='utf-8') as handle:
              data = json.load(handle)
          source = data.get('source') or {}
          print(f"build_type={data.get('build_type')}")
          print(f"source_branch={source.get('branch')}")
          print(f"source_path={source.get('path')}")
          print(f"html_url={data.get('html_url')}")
          assert data.get('build_type') in {'legacy', 'workflow'}
          if data.get('build_type') == 'legacy':
              assert source.get('branch') == 'main'
              assert source.get('path') in {'/docs', '/'}
          PY

      - name: Verify current visual-coverage contract from GitHub runner
        run: |
          set -euo pipefail
          page_url="$(python3 -c "import json; print(json.load(open('/tmp/pages.json')).get('html_url') or '')")"
          if [ -z "${page_url}" ]; then
            echo "::error::Pages configuration did not expose html_url."
            exit 1
          fi
          base_url="${page_url%/}"
          stamp="${GITHUB_SHA}-$(date +%s)"
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${base_url}/?pr_probe=${stamp}" --output /tmp/live-root.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${base_url}/entities/sela-orrin/?pr_probe=${stamp}" --output /tmp/live-sela.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${base_url}/relationships/relationships.json?pr_probe=${stamp}" --output /tmp/live-relationships.json
          grep -Fq 'data-visual-coverage="fallback"' /tmp/live-root.html
          grep -Fq 'Khar Venn — Blood Ring witness context' /tmp/live-root.html
          grep -Fq 'data-visual-coverage="fallback"' /tmp/live-sela.html
          grep -Fqi 'not a portrait' /tmp/live-sela.html
          cmp --silent /tmp/live-relationships.json docs/relationships/relationships.json
          python3 - <<'PY'
          import json
          expected = json.load(open('docs/relationships/relationships.json', encoding='utf-8'))
          data = json.load(open('/tmp/live-relationships.json', encoding='utf-8'))
          assert data == expected
          relationships = data.get('relationships', [])
          assert data.get('entity_count') == len(expected.get('entities', []))
          assert data.get('relationship_count') == len(expected.get('relationships', []))
          assert len(relationships) == data.get('relationship_count')
          assert all(item.get('kind') == 'mentions' for item in relationships)
          assert all(item.get('evidence_class') == 'observed-xref' for item in relationships)
          assert all('relation_class' not in item for item in relationships)
          PY
          echo "Verified current live visual-coverage contract at ${page_url}"

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.target.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect whether the Pages source changed
        id: source_delta
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "source_changed=true" >> "${GITHUB_OUTPUT}"
            echo "Manual dispatch: forcing a Pages source rebuild."
            exit 0
          fi

          if git rev-parse "${GITHUB_SHA}^1" >/dev/null 2>&1; then
            changed="$(git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}")"
          else
            changed="$(git show --pretty='' --name-only "${GITHUB_SHA}")"
          fi
          printf '%s\n' "${changed}"
          if printf '%s\n' "${changed}" | grep -Eq '^(docs/|index\.html$)'; then
            echo "source_changed=true" >> "${GITHUB_OUTPUT}"
            echo "Pages source changed; legacy rebuild is required."
          else
            echo "source_changed=false" >> "${GITHUB_OUTPUT}"
            echo "Only publication workflow/config changed; skipping redundant legacy rebuild."
          fi

      - name: Inspect active Pages source
        id: pages_config
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --output /tmp/pages.json
          python3 - <<'PY'
          import json
          import os

          with open('/tmp/pages.json', encoding='utf-8') as handle:
              data = json.load(handle)
          source = data.get('source') or {}
          values = {
              'build_type': data.get('build_type') or '',
              'source_branch': source.get('branch') or '',
              'source_path': source.get('path') or '',
              'html_url': data.get('html_url') or '',
          }
          if values['build_type'] not in {'legacy', 'workflow'}:
              raise SystemExit(f"Unsupported Pages build_type: {values['build_type']!r}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          print(f"Pages build_type={values['build_type']}")
          print(f"Pages source={values['source_branch']} {values['source_path']}")
          print(f"Pages url={values['html_url']}")
          PY

      - name: Validate legacy source contract
        if: steps.pages_config.outputs.build_type == 'legacy'
        env:
          SOURCE_BRANCH: ${{ steps.pages_config.outputs.source_branch }}
          SOURCE_PATH: ${{ steps.pages_config.outputs.source_path }}
        run: |
          set -euo pipefail
          if [ "${SOURCE_BRANCH}" != "main" ]; then
            echo "::error::Legacy Pages is pointed at ${SOURCE_BRANCH}, expected main."
            exit 1
          fi
          case "${SOURCE_PATH}" in
            /docs|/) ;;
            *)
              echo "::error::Legacy Pages source path ${SOURCE_PATH} is unsupported."
              exit 1
              ;;
          esac

      - name: Request legacy branch-source rebuild
        if: steps.pages_config.outputs.build_type == 'legacy' && steps.source_delta.outputs.source_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location \
            --output /tmp/pages-build.json \
            --write-out '%{http_code}' \
            --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds")"
          if [ "${status}" != "201" ]; then
            echo "::error::GitHub rejected the legacy Pages rebuild request with HTTP ${status}."
            cat /tmp/pages-build.json || true
            exit 1
          fi
          echo "Legacy Pages rebuild requested for ${GITHUB_REPOSITORY}."

      - name: Wait for exact legacy Pages source commit
        if: steps.pages_config.outputs.build_type == 'legacy' && steps.source_delta.outputs.source_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            curl --fail-with-body --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
              --output /tmp/pages-build-latest.json
            build_status="$(python3 -c "import json; print(json.load(open('/tmp/pages-build-latest.json')).get('status') or '')")"
            build_commit="$(python3 -c "import json; print(json.load(open('/tmp/pages-build-latest.json')).get('commit') or '')")"
            echo "Pages build attempt ${attempt}: status=${build_status} commit=${build_commit}"
            if [ "${build_commit}" = "${GITHUB_SHA}" ] && [ "${build_status}" = "built" ]; then
              echo "Exact Pages build completed for ${GITHUB_SHA}."
              exit 0
            fi
            if [ "${build_commit}" = "${GITHUB_SHA}" ] && [ "${build_status}" = "errored" ]; then
              echo "::error::Pages build errored for ${GITHUB_SHA}."
              cat /tmp/pages-build-latest.json
              exit 1
            fi
            sleep 5
          done
          echo "::error::Pages never reported a built deployment for exact source commit ${GITHUB_SHA}."
          cat /tmp/pages-build-latest.json || true
          exit 1

      - name: Configure GitHub Pages workflow deployment
        if: steps.pages_config.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5

      - name: Upload Compendium site
        if: steps.pages_config.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy Compendium artifact
        if: steps.pages_config.outputs.build_type == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Resolve live Pages URL
        id: target
        env:
          CONFIG_URL: ${{ steps.pages_config.outputs.html_url }}
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          page_url="${DEPLOY_URL:-${CONFIG_URL}}"
          if [ -z "${page_url}" ]; then
            echo "::error::GitHub Pages did not provide a live site URL."
            exit 1
          fi
          echo "page_url=${page_url}" >> "${GITHUB_OUTPUT}"
          echo "Verifying ${page_url}"

      - name: Verify exact visual-coverage publication at live edge
        env:
          PAGE_URL: ${{ steps.target.outputs.page_url }}
        run: |
          set -euo pipefail
          base_url="${PAGE_URL%/}"
          for attempt in $(seq 1 48); do
            root_probe="${base_url}/?deployment=${GITHUB_SHA}&attempt=${attempt}"
            sela_probe="${base_url}/entities/sela-orrin/?deployment=${GITHUB_SHA}&attempt=${attempt}"
            rel_probe="${base_url}/relationships/relationships.json?deployment=${GITHUB_SHA}&attempt=${attempt}"
            root_ok=0
            sela_ok=0
            rel_ok=0

            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
              "${root_probe}" --output /tmp/live-root.html; then
              if grep -Fq 'Starsilk Compendium' /tmp/live-root.html \
                && grep -Fq 'id="dossierSearch"' /tmp/live-root.html \
                && grep -Fq 'data-visual-coverage="fallback"' /tmp/live-root.html \
                && grep -Fq 'Khar Venn — Blood Ring witness context' /tmp/live-root.html; then
                root_ok=1
              fi
            fi

            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
              "${sela_probe}" --output /tmp/live-sela.html; then
              if grep -Fq 'data-visual-coverage="fallback"' /tmp/live-sela.html \
                && grep -Fqi 'not a portrait' /tmp/live-sela.html \
                && grep -Fq 'Khar Venn — Blood Ring witness context' /tmp/live-sela.html; then
                sela_ok=1
              fi
            fi

            if curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
              "${rel_probe}" --output /tmp/live-relationships.json; then
              if cmp --silent /tmp/live-relationships.json docs/relationships/relationships.json \
                && python3 -c "import json; d=json.load(open('/tmp/live-relationships.json')); e=json.load(open('docs/relationships/relationships.json')); assert d == e; r=d.get('relationships', []); assert d.get('entity_count') == len(e.get('entities', [])); assert d.get('relationship_count') == len(e.get('relationships', [])); assert len(r) == d.get('relationship_count'); assert all(x.get('kind') == 'mentions' and x.get('evidence_class') == 'observed-xref' and 'relation_class' not in x for x in r)"; then
                rel_ok=1
              fi
            fi

            echo "Live proof attempt ${attempt}: root=${root_ok} sela=${sela_ok} relationships=${rel_ok}"
            if [ "${root_ok}" = 1 ] && [ "${sela_ok}" = 1 ] && [ "${rel_ok}" = 1 ]; then
              echo "Verified exact visual-coverage publication at ${PAGE_URL}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages publication never converged to the exact visual-coverage contract."
          grep -n -m 1 'Khar Venn' /tmp/live-root.html || true
          grep -n -m 1 'not a portrait' /tmp/live-sela.html || true
          head -c 1200 /tmp/live-relationships.json || true
          exit 1
