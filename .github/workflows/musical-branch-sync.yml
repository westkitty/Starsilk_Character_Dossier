name: Musical Score Room — temporary source-to-pages sync
on:
  push:
    branches:
      - feature/musical-score-room-20261027
permissions:
  contents: write
jobs:
  sync-publication:
    if: github.ref == 'refs/heads/feature/musical-score-room-20261027'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Regenerate exact source-derived publication and graph
        run: |
          set -euo pipefail
          python3 build/generate.py
          python3 tools/validate_derivation_map.py --write-projection
          bash tools/build.sh
          bash tools/build.sh --check
          python3 -m pytest tests/test_musical_publication.py -q
      - name: Commit publication and retire one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/musical-branch-sync.yml
          git add docs src/system/DERIVATION_GRAPH.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No publication changes'; exit 1; }
          git commit -m "Build Musical Score Room publication and retire bootstrap workflow"
          git push origin HEAD:refs/heads/feature/musical-score-room-20261027
