name: Codec Wound Graph state closure

on:
  push:
    branches: [docs/codec-wound-graph-closure-2026-09-17]
    paths:
      - '.github/workflows/codec-wound-state-closure.yml'

permissions:
  contents: write

jobs:
  close-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/codec-wound-graph-closure-2026-09-17
          fetch-depth: 0
      - name: Record verified Wound Graph closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('OPERATIONAL_STATE.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^revision: 42$', 'revision: 43', text, count=1, flags=re.M)
          pending_old = '- Codec Wound Graph is implemented on `feature/codec-wound-graph`; protected PR CI, protected merge, and exact live Pages proof remain pending. Museum + AI remains complete at Phase 12 of 12; Wound Graph is post-program capability work, not Phase 13.'
          pending_new = '- None. Codec Wound Graph is merged, published, and independently live-edge verified. Museum + AI remains complete at Phase 12 of 12; Wound Graph is post-program capability work, not Phase 13.'
          if pending_old not in text:
              raise SystemExit('Expected Wound Graph pending line missing')
          text = text.replace(pending_old, pending_new, 1)
          revision43 = '- Revision 43: closed Codec Wound Graph publication evidence after protected PR #73. PR CI run `35283805702` passed the full pinned Chromium suite plus representative Firefox/WebKit journeys; the feature merged through protected `main` at `62d638143db4b2117a570920c8251b3d2bae37ac`. Pages run `35284047801` verified the exact legacy Pages source commit and live publication. Independent live-proof run `35284130840` then fetched the public root, `wound-graph.js`, and `wound-graph.css` cache-busted and proved byte-for-byte parity with the exact merge checkout: root SHA-256 `77b22ee0d3d05235327b0ad8ad7a17a1417dc5042ce6229b9649078631e3ded2`, Wound JS SHA-256 `7456b072c962460cc4da5bf2660ac5158e5ad50bd08ad1db4f3d0e4177ea9ce5`, and Wound CSS SHA-256 `d877a175f185e5fd1be22a037b5227b381a961f68776bba2569f50256cd59a9c`. The live JS exposes the exact boundaries `Evidence network, not causal authority.`, `LOCAL ANALYSIS · ZERO CANON AUTHORITY`, `Not proof of causation.`, and `Canon Ledger order is evidence order, not guaranteed chronology.`, contains no `localStorage` reference, and the live CSS retains the 44px interactive-target floor. The independent proof workflow existed only on the already-merged feature branch and was removed after proof; it never entered `main`. No canon prose, machine canon locks, semantic relationship authority, media provenance, dependency, backend, telemetry, automatic persistence, repository-write path, canon-promotion path, global graph, morality score, or Phase 13 was added by this closure. Pending work for Codec Wound Graph is none.'
          if revision43 not in text:
              matches = list(re.finditer(r'^- Revision 42:.*$', text, flags=re.M))
              if not matches:
                  raise SystemExit('Revision 42 anchor missing')
              m = matches[-1]
              text = text[:m.end()] + '\n' + revision43 + text[m.end():]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify state-only working diff
        run: |
          set -eu
          changed="$(git diff --name-only)"
          test "${changed}" = 'OPERATIONAL_STATE.md'
          grep -Fq 'revision: 43' OPERATIONAL_STATE.md
          grep -Fq 'None. Codec Wound Graph is merged, published, and independently live-edge verified.' OPERATIONAL_STATE.md
          grep -Fq '35284130840' OPERATIONAL_STATE.md
          git diff --check
      - name: Remove one-shot workflow, commit, and prove net branch diff
        run: |
          set -eu
          rm .github/workflows/codec-wound-state-closure.yml
          git add -A
          changed="$(git diff --cached --name-only)"
          printf '%s\n' "${changed}"
          test "${changed}" = ".github/workflows/codec-wound-state-closure.yml
OPERATIONAL_STATE.md"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close Codec Wound Graph publication evidence'
          net="$(git diff --name-only origin/main...HEAD)"
          printf 'Net branch diff:\n%s\n' "${net}"
          test "${net}" = 'OPERATIONAL_STATE.md'
          git push origin HEAD:docs/codec-wound-graph-closure-2026-09-17
