name: Codec Wound Graph state closure

on:
  push:
    branches:
      - docs/codec-wound-graph-closure-2026-09-17

permissions:
  contents: write

jobs:
  close-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/codec-wound-graph-closure-2026-09-17
          fetch-depth: 0
      - name: Close verified Wound Graph state
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          state = Path('OPERATIONAL_STATE.md')
          text = state.read_text(encoding='utf-8')
          if 'revision: 42' not in text:
              raise SystemExit('Expected revision 42 baseline missing')
          text = text.replace('revision: 42', 'revision: 43', 1)
          old = '- Codec Wound Graph is implemented on `feature/codec-wound-graph`; protected PR CI, protected merge, and exact live Pages proof remain pending. Museum + AI remains complete at Phase 12 of 12; Wound Graph is post-program capability work, not Phase 13.'
          new = '- None. Codec Wound Graph is merged, published, and independently live-edge verified. Museum + AI remains complete at Phase 12 of 12; Wound Graph is post-program capability work, not Phase 13.'
          if old not in text:
              raise SystemExit('Expected pending line missing')
          text = text.replace(old, new, 1)
          entry = '- Revision 43: closed Codec Wound Graph publication evidence after protected PR #73. PR CI run `35283805702` passed the full pinned Chromium suite plus representative Firefox/WebKit journeys; the feature merged through protected `main` at `62d638143db4b2117a570920c8251b3d2bae37ac`. Pages run `35284047801` verified the exact legacy Pages source commit and live publication. Independent live-proof run `35284130840` then fetched the public root, `wound-graph.js`, and `wound-graph.css` cache-busted and proved byte-for-byte parity with the exact merge checkout: root SHA-256 `77b22ee0d3d05235327b0ad8ad7a17a1417dc5042ce6229b9649078631e3ded2`, Wound JS SHA-256 `7456b072c962460cc4da5bf2660ac5158e5ad50bd08ad1db4f3d0e4177ea9ce5`, and Wound CSS SHA-256 `d877a175f185e5fd1be22a037b5227b381a961f68776bba2569f50256cd59a9c`. The live JS exposes the exact boundaries `Evidence network, not causal authority.`, `LOCAL ANALYSIS · ZERO CANON AUTHORITY`, `Not proof of causation.`, and `Canon Ledger order is evidence order, not guaranteed chronology.`, contains no `localStorage` reference, and the live CSS retains the 44px interactive-target floor. The independent proof workflow existed only on the already-merged feature branch and was removed after proof; it never entered `main`. No canon prose, machine canon locks, semantic relationship authority, media provenance, dependency, backend, telemetry, automatic persistence, repository-write path, canon-promotion path, global graph, morality score, or Phase 13 was added by this closure. Pending work for Codec Wound Graph is none.'
          if entry not in text:
              matches = list(re.finditer(r'^- Revision 42:.*$', text, flags=re.M))
              if not matches:
                  raise SystemExit('Revision 42 log entry missing')
              pos = matches[-1].end()
              text = text[:pos] + '\n' + entry + text[pos:]
          state.write_text(text, encoding='utf-8')

          work = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          if work != ['OPERATIONAL_STATE.md']:
              raise SystemExit(f'Unexpected working diff: {work}')
          subprocess.run(['git', 'diff', '--check'], check=True)

          Path('.github/workflows/codec-wound-state-closure.yml').unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'docs: close Codec Wound Graph publication evidence'], check=True)

          net = subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True).splitlines()
          if net != ['OPERATIONAL_STATE.md']:
              raise SystemExit(f'Unexpected net branch diff: {net}')
          subprocess.run(['git', 'push', 'origin', 'HEAD:docs/codec-wound-graph-closure-2026-09-17'], check=True)
          print('State-only closure materialized with net diff: OPERATIONAL_STATE.md')
          PY
