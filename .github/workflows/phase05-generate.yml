name: Phase 05 generate relationship publication

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare-phase-05:
    if: github.event.pull_request.head.ref == 'phase-05-relationship-observatory'
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Trust worktree and install pinned dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m pip install -r requirements.txt

      - name: Apply bounded source integration
        run: python3 tools/apply_phase05_integration.py

      - name: Generate and validate exact publication
        run: |
          ./tools/build.sh
          ./tools/build.sh --check
          git diff --check

      - name: Focused Phase 05 proof
        run: |
          python3 -m pytest \
            tests/test_relationship_observatory.py \
            tests/test_machine_publication.py \
            tests/test_entity_permalinks.py \
            tests/test_museum_objects.py \
            -q

      - name: Stage and whitelist exact integration/generated state
        run: |
          git checkout -- docs/qa-report.txt || true
          git add \
            build/machine_publication.py \
            src/templates/entity.html.j2 \
            tools/build.sh \
            tests/test_machine_publication.py \
            tests/test_cross_browser.py \
            docs/index.html \
            docs/llms.txt \
            docs/sitemap.xml \
            docs/machine \
            docs/entities \
            docs/relationships
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          allowed_exact = {
              'build/machine_publication.py',
              'src/templates/entity.html.j2',
              'tools/build.sh',
              'tests/test_machine_publication.py',
              'tests/test_cross_browser.py',
              'docs/index.html',
              'docs/llms.txt',
              'docs/sitemap.xml',
          }
          allowed_prefixes = ('docs/machine/', 'docs/entities/', 'docs/relationships/')
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          unexpected = [path for path in changed if path not in allowed_exact and not path.startswith(allowed_prefixes)]
          if unexpected:
              raise SystemExit('unexpected staged Phase 05 path(s): ' + ', '.join(unexpected))
          if not changed:
              raise SystemExit('no staged Phase 05 integration/generated files')
          Path('/tmp/phase05-manifest.txt').write_text('\n'.join(changed) + '\n', encoding='utf-8')
          print('staged Phase 05 whitelist OK:', len(changed), 'files')
          PY
          git diff --cached --binary > /tmp/phase05-generated.patch
          tar -czf /tmp/phase05-generated.tar.gz -T /tmp/phase05-manifest.txt

      - name: Upload exact validated Phase 05 state
        uses: actions/upload-artifact@v4
        with:
          name: phase05-validated-generated-state
          path: |
            /tmp/phase05-manifest.txt
            /tmp/phase05-generated.patch
            /tmp/phase05-generated.tar.gz
          if-no-files-found: error
          retention-days: 1