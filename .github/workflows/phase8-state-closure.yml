name: Phase 8 state closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  close-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-state-closure
          fetch-depth: 0
      - name: Record verified Phase 8 completion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          roadmap = Path('MUSEUM_AI_ROADMAP.md')
          replace_once(
              roadmap,
              '| 8 | Curated Museum Tours and Local Collections | NOT STARTED | — | deferred |',
              '| 8 | Curated Museum Tours and Local Collections | COMPLETE | PR #30; final head `d2a772baacf606cb6085a84e8378e69d3c19be99`; CI `32659617585` PASS; merged `6520f43574eac8de64d67da77dca19bc99f3eb46`; live proof `32659776026` PASS | none |',
          )
          phase8 = '''### Phase 8 — Curated Museum Tours and Local Collections\n\nBuild stable-ID-based guided tours plus browser-local bookmarks/recent/history/collections. No account, analytics, telemetry, duplicated canon prose, or private text in public URLs by default.\n\n#### Completion record\n\n- starting `main`: `bbb228e21e06883a09210c0e063272a80596190c`\n- work branch: `phase-08-tours-local-collections`\n- primary generated implementation commit: `36e119f5f5a1b7915e8c4600f66cb349daafa100`\n- final validated implementation head: `d2a772baacf606cb6085a84e8378e69d3c19be99`\n- implementation repair passes used: zero\n- one-shot implementation/build/focused-proof run: `32659489379` PASS\n- successful required final CI: run `32659617585` (Chromium, Firefox, and WebKit PASS)\n- implementation PR: `#30`\n- implementation merge on `main`: `6520f43574eac8de64d67da77dca19bc99f3eb46`\n- execution-only live proof PR: `#31`, closed unmerged\n- successful live proof: run `32659776026`, job `97244053606`\n- generated public tour surface: six deterministic files under `/tours/` (`index.html`, `tours.css`, `tours.js`, `tours.json`, `schema.json`, `AUTHORITY.md`)\n- curated route source: six stable tour IDs in `src/tours/tours.json`; each binds only to an existing authored `src/content/nav.json` navigation group, producing 29 ordered stable-record stops without duplicating canon prose\n- tour semantics remain editorial navigation only: route membership/order does not assert chronology, causality, importance, faction membership, kinship, or other semantic relationships\n- browser-local library supports bookmarks, recent openings, timestamped local history, per-tour completion progress, and user-named collections via origin-local storage; storage failure falls back to page-session memory\n- privacy guarantees: no account/sign-in, analytics, telemetry, beacon, server write, or external runtime request; user-authored collection names/history are not published and local private text is never serialized into public URLs\n- local bookmarks, history, collections, and completion marks are user state only and never canon or relationship evidence\n- entity and discovery surfaces expose conservative `/tours/` / `#record-<stable-id>` entry points while canonical entity permalinks, legacy anchors, script-free entity-page behavior, root `dossierSearch`, museum identities, relationship evidence, and Canon Inspector semantics remain intact\n- machine publication adds the versioned tour-index schema, `/tours/` endpoints, `llms.txt` orientation, sitemap coverage, and `src/tours/tours.json` source declaration through the existing deterministic publisher\n- final diff-scope review found no dependency/lockfile changes, canonical-media changes, authored canon-prose changes, stable-ID renames, museum-object identity changes, relationship-semantic promotion, or Phase 9 implementation\n- live proof established `LIVE_PHASE8_BYTES_OK tours=6 exact_files=13 local_state=browser-only private_urls=clean root-search=unchanged`\n- downloaded live proof set passed `tools/check_public_boundary.py` across 11 text/machine files\n- live Chromium proof established `LIVE_PHASE8_BROWSER_OK deep-link=ok bookmark=ok collections=ok progress=ok recent-history=ok entity-discovery=ok mobile=ok network=local-origin-only`\n- Phase 9 was not started\n\n**Completion verdict: VERIFIED.**\n'''
          replace_once(
              roadmap,
              '### Phase 8 — Curated Museum Tours and Local Collections\n\nBuild stable-ID-based guided tours plus browser-local bookmarks/recent/history/collections. No account, analytics, telemetry, duplicated canon prose, or private text in public URLs by default.\n',
              phase8,
          )

          state = Path('OPERATIONAL_STATE.md')
          replace_once(state, 'revision: 15', 'revision: 16')
          replace_once(
              state,
              '- Museum + AI Phase 7 PR #27 merged at `72837ad5595a0380fe45d2aed1ed7cb5521b6432`.\n',
              '- Museum + AI Phase 7 PR #27 merged at `72837ad5595a0380fe45d2aed1ed7cb5521b6432`.\n- Museum + AI Phase 8 PR #30 merged at `6520f43574eac8de64d67da77dca19bc99f3eb46`.\n',
          )
          replace_once(
              state,
              '- `src/discovery/AUTHORITY.md`, `src/schema/discovery-index.schema.json`, `src/schema/context-packet.schema.json`, and `src/schema/context-packet-index.schema.json` define the Phase 7 discovery/context-packet interpretation boundary.\n',
              '- `src/discovery/AUTHORITY.md`, `src/schema/discovery-index.schema.json`, `src/schema/context-packet.schema.json`, and `src/schema/context-packet-index.schema.json` define the Phase 7 discovery/context-packet interpretation boundary.\n- `build/tour_publication.py` owns deterministic generation of `docs/tours/`; that surface is an editorial stable-ID navigation and browser-local convenience derivative, not canon, chronology, relationship, or user-account authority.\n- `src/tours/tours.json` owns stable curated-tour IDs and their existing-navigation-group binding; `src/content/nav.json` remains authority for ordered tour-stop membership. `src/tours/AUTHORITY.md` and `src/schema/tour-index.schema.json` define the Phase 8 interpretation/publication boundary.\n',
          )
          invariants = '''57. Phase 7 discovery is additive. The existing complete-Compendium `dossierSearch`, navigation behavior, canonical entity permalinks, legacy anchors, museum identities, relationship evidence identities, and Canon Inspector semantics must remain supported unless a later explicit phase contract intentionally changes them.\n58. `docs/tours/` is generator-owned output from `build/tour_publication.py`. Stable tour IDs/bindings derive from `src/tours/tours.json`, while stop membership and order derive only from existing authored `src/content/nav.json` stable IDs; generated tour output must not become a second canon prose database.\n59. Curated tour route membership and ordering are editorial navigation only. They do not prove chronology, causality, importance, faction membership, kinship, location, or any other semantic relationship. Missing lore facts remain unknown.\n60. Phase 8 persistent library data is browser-local user state only: bookmarks, recent openings, timestamped local history, completion progress, and named collections. It requires no account and must not use analytics, telemetry, beacons, server writes, or external runtime services.\n61. User-authored collection names and local history must not enter generated publication, machine indexes, canon/evidence surfaces, or public URLs. Local state is never canon/relationship evidence; clearing site storage removes persistence, and unavailable storage falls back to current-page memory rather than remote persistence.\n62. Phase 8 is additive to the existing human surfaces. Canonical entity pages remain script-free except inert JSON-LD and may only link into the `/tours/` local-library surface; root `dossierSearch`, legacy anchors, museum identities, observed-xref semantics, and Canon Inspector authority boundaries remain intact.\n63. Public tour/machine derivatives must remain deterministic, boundary-checked, and independently verified at the live Pages edge whenever Phase 8 publication changes.\n'''
          replace_once(
              state,
              '57. Phase 7 discovery is additive. The existing complete-Compendium `dossierSearch`, navigation behavior, canonical entity permalinks, legacy anchors, museum identities, relationship evidence identities, and Canon Inspector semantics must remain supported unless a later explicit phase contract intentionally changes them.\n',
              invariants,
