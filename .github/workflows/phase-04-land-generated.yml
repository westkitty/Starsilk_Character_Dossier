name: Phase 04 generate and verify museum publication

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-museum:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Trust worktree and install pinned dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m pip install -r requirements.txt

      - name: Generate through the authoritative pipeline
        run: ./tools/build.sh

      - name: Focused Phase 04 proof before landing generated bytes
        run: |
          python3 -m pytest tests/test_museum_objects.py -q
          python3 -m pytest tests/test_cross_browser.py -q -k museum_object_deep_link_and_escape_journey
          ./tools/build.sh --check
          git diff --check

      - name: Protect forbidden surfaces and stage only Phase 04 generated output
        run: |
          git restore --worktree docs/qa-report.txt 2>/dev/null || true
          forbidden="$(git diff --name-only -- docs/index.html docs/asset-manifest.json docs/assets src/content src/canon media || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::Phase 04 touched a protected surface:"
            printf '%s\n' "$forbidden"
            exit 1
          fi

          unexpected="$(git diff --name-only | grep -Ev '^(docs/objects/|docs/entities/index\.html$|\.github/workflows/phase-04-land-generated\.yml$)' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Generator produced changes outside the authorized generated set:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          git add docs/objects docs/entities/index.html
          git rm .github/workflows/phase-04-land-generated.yml
          staged="$(git diff --cached --name-only)"
          unexpected_staged="$(printf '%s\n' "$staged" | grep -Ev '^(docs/objects/|docs/entities/index\.html$|\.github/workflows/phase-04-land-generated\.yml$)' || true)"
          if [ -n "$unexpected_staged" ]; then
            echo "::error::Unexpected staged path:"
            printf '%s\n' "$unexpected_staged"
            exit 1
          fi

      - name: Commit exact verified publication and retire this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(phase-04): publish verified museum object surface"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
