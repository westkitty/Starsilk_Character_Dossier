name: Verify merged visual coverage live

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/live-visual-proof.yml"

jobs:
  prove-live-state:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Read Pages configuration and latest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --output /tmp/pages.json
          curl --fail-with-body --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
            --output /tmp/pages-build.json
          python3 - <<'PY'
          import json
          pages = json.load(open('/tmp/pages.json', encoding='utf-8'))
          build = json.load(open('/tmp/pages-build.json', encoding='utf-8'))
          source = pages.get('source') or {}
          print('build_type=', pages.get('build_type'))
          print('source_branch=', source.get('branch'))
          print('source_path=', source.get('path'))
          print('html_url=', pages.get('html_url'))
          print('latest_build_status=', build.get('status'))
          print('latest_build_commit=', build.get('commit'))
          print('latest_build_updated_at=', build.get('updated_at'))
          assert pages.get('build_type') == 'legacy'
          assert source.get('branch') == 'main'
          assert source.get('path') == '/docs'
          assert build.get('status') == 'built'
          PY

      - name: Prove exact visual coverage at public edge
        run: |
          set -euo pipefail
          page_url="$(python3 -c "import json; print(json.load(open('/tmp/pages.json')).get('html_url') or '')")"
          base_url="${page_url%/}"
          stamp="${GITHUB_SHA}-$(date +%s)"
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${base_url}/?live_probe=${stamp}" --output /tmp/root.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${base_url}/entities/sela-orrin/?live_probe=${stamp}" --output /tmp/sela.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${base_url}/relationships/relationships.json?live_probe=${stamp}" --output /tmp/relationships.json

          grep -Fq 'data-visual-coverage="fallback"' /tmp/root.html
          grep -Fq 'Khar Venn — Blood Ring witness context' /tmp/root.html
          grep -Fq 'data-visual-coverage="fallback"' /tmp/sela.html
          grep -Fqi 'not a portrait' /tmp/sela.html
          grep -Fq 'Khar Venn — Blood Ring witness context' /tmp/sela.html
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/relationships.json', encoding='utf-8'))
          relationships = data.get('relationships', [])
          assert data.get('entity_count') == 127, data.get('entity_count')
          assert data.get('relationship_count') == 138, data.get('relationship_count')
          assert len(relationships) == 138, len(relationships)
          assert all(item.get('kind') == 'mentions' for item in relationships)
          assert all(item.get('evidence_class') == 'observed-xref' for item in relationships)
          print('LIVE ROOT: visual fallback marker + Khar Venn context PASS')
          print('LIVE SELA: fallback + not-a-portrait boundary PASS')
          print('LIVE RELATIONSHIPS: 127 entities / 138 observed mentions PASS')
          PY
