name: Refresh State Sentinel Topology

on:
  push:
    branches: [uplift/operational-state-sentinel]
    paths:
      - ".github/workflows/state-sentinel-graph-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uplift/operational-state-sentinel
          fetch-depth: 1

      - name: Add invariant manifest to topology and regenerate projection
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('src/system/derivation-map.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          topology = next(node for node in data['nodes'] if node['id'] == 'topology')
          invariant_path = 'src/system/operational-state-invariants.json'
          if invariant_path not in topology['paths']:
              topology['paths'].append(invariant_path)
          path.write_text(json.dumps(data, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          python3 tools/validate_derivation_map.py --write-projection
          python3 tools/check_operational_state_freshness.py
          git diff --check

      - name: Commit refreshed topology
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/system/derivation-map.json src/system/DERIVATION_GRAPH.md
          git commit -m "Include Operational State invariants in topology"
          git push origin HEAD:uplift/operational-state-sentinel
