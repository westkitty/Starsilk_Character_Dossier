name: Apply archive gate and cover title fix

on:
  push:
    branches: [work/archive-gate-title-lock]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Apply bounded source and regression-test changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("src/templates/app.js")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              "    var debounceTimer;\n    searchInput.addEventListener('input', function(){\n      clearTimeout(debounceTimer);\n      var q = searchInput.value.trim();\n      debounceTimer = setTimeout(function(){ runSearch(q); }, 120);\n    });",
              "    var debounceTimer;\n    searchInput.addEventListener('input', function(){\n      clearTimeout(debounceTimer);\n      var q = searchInput.value.trim();\n      if(q === 'ajd' && typeof setArchiveMode === 'function'){\n        setArchiveMode(true);\n        searchInput.value = '';\n        runSearch('');\n        return;\n      }\n      debounceTimer = setTimeout(function(){ runSearch(q); }, 120);\n    });",
              "search unlock hook",
          )
          app = replace_once(
              app,
              "    var MODE_KEY = 'starsilk-archive-mode';\n",
              "",
              "legacy archive storage key",
          )
          app = replace_once(
              app,
              "      modeToggle.textContent = on ? 'Reader mode' : 'Archive tools';\n      try { localStorage.setItem(MODE_KEY, on ? '1' : '0'); } catch(e){}",
              "      modeToggle.textContent = on ? 'Reader mode' : 'Archive tools';\n      modeToggle.hidden = !on;",
              "archive visibility/persistence",
          )
          app = replace_once(
              app,
              "    modeToggle.addEventListener('click', function(){\n      setArchiveMode(!document.documentElement.classList.contains('archive-mode'));\n    });\n    var modeInitial = false;\n    try { modeInitial = localStorage.getItem(MODE_KEY) === '1'; } catch(e){}\n    setArchiveMode(modeInitial);",
              "    modeToggle.addEventListener('click', function(){\n      setArchiveMode(false);\n    });\n    try { localStorage.removeItem('starsilk-archive-mode'); } catch(e){}\n    setArchiveMode(false);",
              "archive toggle and startup lock",
          )
          app_path.write_text(app, encoding="utf-8")

          shell_path = Path("src/templates/shell.html.j2")
          shell = shell_path.read_text(encoding="utf-8")
          shell = replace_once(
              shell,
              '<button type="button" id="modeToggle" class="index-mode-toggle" aria-pressed="false">Archive tools</button>',
              '<button type="button" id="modeToggle" class="index-mode-toggle" aria-pressed="false" hidden>Archive tools</button>',
              "archive button hidden-by-default markup",
          )
          shell_path.write_text(shell, encoding="utf-8")

          css_path = Path("src/templates/style.css")
          css = css_path.read_text(encoding="utf-8")
          css = replace_once(
              css,
              'h1 span{display:block;color:transparent;-webkit-text-stroke:1px #98bfd0;font-size:.58em;letter-spacing:-.04em}',
              'h1 span{display:block;color:transparent;-webkit-text-stroke:1px #98bfd0;font-size:.58em;letter-spacing:-.04em}\n.cover h1{font-size:clamp(1.65rem,7vw,7rem);max-width:none;white-space:nowrap}',
              "single-line cover title rule",
          )
          css = replace_once(
              css,
              '#modeToggle[aria-pressed="true"]{background:#16324e;border-color:var(--thread)}',
              '#modeToggle[aria-pressed="true"]{background:#16324e;border-color:var(--thread)}\n#modeToggle[hidden]{display:none}',
              "archive hidden safeguard",
          )
          css_path.write_text(css, encoding="utf-8")

          tests_path = Path("tests/test_dossier.py")
          tests = tests_path.read_text(encoding="utf-8")
          start = tests.index("def test_reader_mode_is_default_and_archive_tools_toggle_works")
          end = tests.index("def test_attachment_upload_and_status", start)
          replacement = '''def test_archive_tools_require_search_phrase_and_do_not_persist(page: Page, local_server):
              """Archive controls stay out of ordinary reading, require the exact
              search-field phrase, and relock instead of persisting across reloads."""
              page.set_viewport_size({"width": 1280, "height": 800})
              page.goto(f"{local_server}/index.html")
              page.evaluate("document.getElementById('archive').querySelector('details.page-disclosure').open = true")

              mode_toggle = page.locator("#modeToggle")
              expect(mode_toggle).to_be_hidden()
              expect(mode_toggle).to_have_attribute("aria-pressed", "false")
              expect(mode_toggle).to_have_text("Archive tools")
              assert "archive-mode" not in page.evaluate("document.documentElement.className")

              file_input = page.locator(".attachment-stage .asset-file").first
              assert page.evaluate("getComputedStyle(document.querySelector('.attachment-stage .asset-file')).display") == "none"

              search = page.locator("#dossierSearch")
              search.fill("AJD")
              expect(mode_toggle).to_be_hidden()
              search.fill("aj")
              expect(mode_toggle).to_be_hidden()
              search.fill("ajd")

              expect(mode_toggle).to_be_visible()
              expect(mode_toggle).to_have_attribute("aria-pressed", "true")
              expect(mode_toggle).to_have_text("Reader mode")
              expect(search).to_have_value("")
              assert "archive-mode" in page.evaluate("document.documentElement.className")
              assert page.evaluate("getComputedStyle(document.querySelector('.attachment-stage .asset-file')).display") != "none"

              mode_toggle.click()
              expect(mode_toggle).to_be_hidden()
              expect(mode_toggle).to_have_attribute("aria-pressed", "false")
              expect(mode_toggle).to_have_text("Archive tools")
              assert "archive-mode" not in page.evaluate("document.documentElement.className")
              assert page.evaluate("getComputedStyle(document.querySelector('.attachment-stage .asset-file')).display") == "none"

              page.reload()
              expect(page.locator("#modeToggle")).to_be_hidden()
              expect(page.locator("#modeToggle")).to_have_attribute("aria-pressed", "false")
              assert "archive-mode" not in page.evaluate("document.documentElement.className")
              assert page.evaluate("localStorage.getItem('starsilk-archive-mode')") is None


          '''
          replacement = "\n".join(line[10:] if line.startswith("          ") else line for line in replacement.splitlines()) + "\n"
          tests = tests[:start] + replacement + tests[end:]

          old_unlock = '    page.click("#modeToggle")'
          unlock_count = tests.count(old_unlock)
          if unlock_count != 4:
              raise SystemExit(f"attachment test unlocks: expected 4 legacy clicks, found {unlock_count}")
          tests = tests.replace(
              old_unlock,
              '    page.locator("#dossierSearch").fill("ajd")\n    expect(page.locator("#modeToggle")).to_be_visible()',
          )

          title_marker = "def test_hero_video_present_and_loops_true_tail"
          title_insert_at = tests.index(title_marker)
          title_test = '''@pytest.mark.parametrize("width", [320, 375, 951, 1024, 1280, 1920])
          def test_cover_title_stays_on_one_line(page: Page, local_server, width: int):
              page.set_viewport_size({"width": width, "height": 800})
              page.goto(f"{local_server}/index.html")
              rect_count = page.evaluate("""() => {
                  const h1 = document.querySelector('#cover h1');
                  const range = document.createRange();
                  range.selectNodeContents(h1);
                  return range.getClientRects().length;
              }""")
              assert rect_count == 1, f"cover title wrapped at {width}px"
              box = page.locator("#cover h1").bounding_box()
              assert box is not None
              viewport_width = page.evaluate("document.documentElement.clientWidth")
              assert box["x"] + box["width"] <= viewport_width + 1, f"cover title overflowed at {width}px"


          '''
          title_test = "\n".join(line[10:] if line.startswith("          ") else line for line in title_test.splitlines()) + "\n"
          tests = tests[:title_insert_at] + title_test + tests[title_insert_at:]
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Build generated site from authoritative sources
        run: ./tools/build.sh

      - name: Refresh intentional visual baselines in pinned environment
        env:
          UPDATE_VISUAL_BASELINES: "1"
        run: python3 -m pytest tests/test_dossier.py -k 'test_visual_' -q

      - name: Verify deterministic deployable output
        run: |
          ./tools/build.sh --check
          git diff --check

      - name: Full Chromium regression suite
        run: python3 -m pytest tests/ -q

      - name: Firefox representative journeys
        run: python3 -m pytest tests/test_cross_browser.py --browser firefox -q

      - name: WebKit representative journeys
        run: python3 -m pytest tests/test_cross_browser.py --browser webkit -q

      - name: Record verified operational state
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("OPERATIONAL_STATE.md")
          text = path.read_text(encoding="utf-8")
          if "revision: 6" not in text:
              raise SystemExit("expected operational-state revision 6")
          text = text.replace("revision: 6", "revision: 7", 1)
          invariant = "14. The durable off-repository backup is stored in Google Drive folder `Starsilk Canonical Media Recovery - 2026-08-23`; keep its seven ordered transfer chunks plus verification bundle together. Restore only after reassembly and SHA-256 verification of the final recovery ZIP."
          text = text.replace(
              invariant,
              invariant + "\n15. Public Archive Tools remain local-only browser maintenance controls with no repository-write path. They must load locked in Reader mode, require the exact search-field unlock phrase for the current page session, and must not persist an unlocked state across reloads.",
              1,
          )
          run_id = os.environ["GITHUB_RUN_ID"]
          section = f'''\n## Archive Tools access gate and cover title — VERIFIED\n\nGitHub Actions run `{run_id}` applied and verified the bounded frontend change in the pinned Playwright environment before commit:\n\n- Archive Tools are hidden and locked on every load.\n- The exact, case-sensitive search-field phrase activates Archive Tools for the current page session.\n- Reader mode relocks the controls; the old localStorage persistence key is removed and ignored.\n- The public page still has no repository-write path; archive attachments remain browser-local maintenance data rather than canonical lore edits.\n- `Starsilk Compendium` remains one source text node and is verified to render on one line without horizontal overflow at 320, 375, 951, 1024, 1280, and 1920 px viewports.\n- Generated `docs/index.html` was rebuilt from authoritative `src/` sources.\n- Intentional visual baselines were regenerated in the pinned Playwright Linux environment.\n- Full Chromium pytest/Playwright suite passed.\n- Firefox representative journeys passed.\n- WebKit representative journeys passed.\n- `./tools/build.sh --check` and `git diff --check` passed.\n'''
          text = text.replace("\n## Known limitations\n", section + "\n## Known limitations\n", 1)
          text = text.rstrip() + "\n- Revision 7: locked Archive Tools behind the session-only search-field phrase gate, removed persisted archive-mode activation, kept `Starsilk Compendium` on one responsive line, regenerated deployable output/visual baselines, and verified Chromium/Firefox/WebKit behavior before commit.\n"
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time workflow and commit verified change set
        shell: bash
        run: |
          git checkout -- docs/qa-report.txt || true
          rm -f .github/workflows/apply-archive-gate.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: gate archive tools and keep cover title single-line"
          git push origin HEAD:work/archive-gate-title-lock
