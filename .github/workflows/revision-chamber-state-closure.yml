name: Revision Chamber state closure

on:
  push:
    branches: [docs/revision-chamber-closure-2026-09-16]
    paths:
      - '.github/workflows/revision-chamber-state-closure.yml'

permissions:
  contents: write

jobs:
  close-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/revision-chamber-closure-2026-09-16
          fetch-depth: 0

      - name: Record verified Revision Chamber closure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('OPERATIONAL_STATE.md')
          text = path.read_text(encoding='utf-8')

          if text.count('revision: 36') != 1:
              raise SystemExit('Expected exactly one revision: 36 marker')
          text = text.replace('revision: 36', 'revision: 37', 1)

          old_pending = '- Revision Chamber implementation is staged as post-program capability work. Protected PR CI, merge, exact Pages publication, and live-edge proof remain pending. Museum + AI remains complete at Phase 12 of 12; this is not Phase 13.'
          new_pending = '- None. Revision Chamber is merged, published, and independently live-edge verified. Museum + AI remains complete at Phase 12 of 12; Revision Chamber is post-program capability work, not Phase 13.'
          if text.count(old_pending) != 1:
              raise SystemExit('Expected exactly one Revision Chamber pending marker')
          text = text.replace(old_pending, new_pending, 1)

          log = (
              '- Revision 37: closed Revision Chamber publication evidence after protected PR #68. '
              'PR CI run `35141247581` passed the full pinned Chromium suite plus representative Firefox/WebKit journeys; '
              'the feature merged through protected `main` at `866e8bc5dc514c9b71a90b63d8122db4a4668471`. '
              'Pages run `35141546190` verified the exact legacy Pages source commit and live publication. '
              'Independent live-proof run `35141809802` then fetched the public root and service worker cache-busted and proved byte-for-byte parity with the exact merge checkout: '
              'root SHA-256 `3b5a3d0a7a0bd33bb966090c38e0d859cbf271afb77e8bab5dfd83dc363618fa`, '
              'service-worker SHA-256 `42f4710ffb035552deff6e297b32bcde63568029a5f626d744a4420c9bea9566`. '
              'The live root exposed `id="revisionChamber"`, the exact `Plan the rewrite. Do not touch reality.` boundary, '
              'the `What would I have to sacrifice?` control, and decoded `starsilk-revision-data/1` with 126 stable records, 16 machine locks, and 27 authored chronology events. '
              'The independent proof workflow existed only on the already-merged feature branch and was removed after proof; it never entered `main`. '
              'No canon prose, media provenance, semantic relationship authority, dependency, backend, telemetry, persistence, repository-write path, or Phase 13 was added by this closure. Pending work for Revision Chamber is none.'
          )
          if 'Revision 37:' in text:
              raise SystemExit('Revision 37 already present')
          path.write_text(text.rstrip() + '\n' + log + '\n', encoding='utf-8')
          PY

      - name: Verify state-only closure diff
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort)" = "OPERATIONAL_STATE.md"
          git diff --check
          grep -Fq 'revision: 37' OPERATIONAL_STATE.md
          grep -Fq 'None. Revision Chamber is merged, published, and independently live-edge verified.' OPERATIONAL_STATE.md
          grep -Fq 'Revision 37:' OPERATIONAL_STATE.md

      - name: Remove one-shot closure workflow and commit
        run: |
          set -euo pipefail
          rm .github/workflows/revision-chamber-state-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPERATIONAL_STATE.md
          git add -u .github/workflows/revision-chamber-state-closure.yml
          git diff --cached --check
          git commit -m "docs: close Revision Chamber publication evidence"
          git push origin HEAD:docs/revision-chamber-closure-2026-09-16
