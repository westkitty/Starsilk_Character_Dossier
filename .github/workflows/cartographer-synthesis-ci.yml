name: Cartographer Synthesis Validation

on:
  pull_request:
    branches:
      - feature/temporal-cartographer-2026-09-07-2
    paths:
      - 'cartographer/**'
      - '.github/workflows/cartographer-synthesis-ci.yml'

permissions:
  contents: read

jobs:
  cartographer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cartographer
    steps:
      - name: Checkout synthesis
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Cartographer dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install browser smoke dependency
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.62.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Analyst Mode browser smoke
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 > /tmp/cartographer-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/cartographer-vite.log || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4177/ >/dev/null; then break; fi
            sleep 0.5
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--enable-unsafe-swiftshader'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 960 } });
          const consoleErrors = [];
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          page.on('pageerror', err => consoleErrors.push(err.message));
          await page.goto('http://127.0.0.1:4177/', { waitUntil: 'networkidle' });

          await page.waitForFunction(() => {
            const host = document.querySelector('starsilk-starmap-host');
            return Boolean(host?.shadowRoot?.querySelector('[role="treeitem"]'));
          });

          const clickShadow = async (selector, text) => page.evaluate(({ selector, text }) => {
            const root = document.querySelector('starsilk-starmap-host')?.shadowRoot;
            if (!root) throw new Error('Missing open Cartographer shadow root');
            const nodes = [...root.querySelectorAll(selector)];
            const target = nodes.find((node) => (node.textContent ?? '').includes(text));
            if (!(target instanceof HTMLElement)) {
              throw new Error(`Missing ${selector} containing ${text}; found: ${nodes.map(n => n.textContent?.trim()).join(' | ')}`);
            }
            target.click();
          }, { selector, text });

          const waitShadowText = async (text) => page.waitForFunction((text) => {
            const root = document.querySelector('starsilk-starmap-host')?.shadowRoot;
            return (root?.textContent ?? '').includes(text);
          }, text);

          const setLabelValue = async (labelText, value) => page.evaluate(({ labelText, value }) => {
            const root = document.querySelector('starsilk-starmap-host')?.shadowRoot;
            if (!root) throw new Error('Missing shadow root');
            const label = [...root.querySelectorAll('label')].find((node) => node.textContent?.trim() === labelText);
            if (!(label instanceof HTMLLabelElement)) throw new Error(`Missing label ${labelText}`);
            const control = root.getElementById(label.htmlFor);
            if (!(control instanceof HTMLInputElement)) throw new Error(`Missing input for ${labelText}`);
            control.value = value;
            control.dispatchEvent(new Event('input', { bubbles: true }));
          }, { labelText, value });

          const setSelect = async (selector, index, value) => page.evaluate(({ selector, index, value }) => {
            const root = document.querySelector('starsilk-starmap-host')?.shadowRoot;
            if (!root) throw new Error('Missing shadow root');
            const select = root.querySelectorAll(selector)[index];
            if (!(select instanceof HTMLSelectElement)) throw new Error(`Missing select ${selector}[${index}]`);
            select.value = value;
            select.dispatchEvent(new Event('change', { bubbles: true }));
          }, { selector, index, value });

          await clickShadow('[role="treeitem"]', 'Fallenstar Region');
          await setLabelValue('Override value', '3');
          await clickShadow('button', 'Override at this era');

          await clickShadow('button', 'ANALYST');
          await waitShadowText('Trace / Why?');
          await waitShadowText('Historical authority: Fallenstar Region');

          await clickShadow('.tc-analyst-tab', 'PALIMPSEST');
          await waitShadowText('COMPOSITE TEMPORAL VIEW');

          await clickShadow('[role="treeitem"]', 'First Blood Ring');
          await clickShadow('.tc-analyst-tab', 'DELTA');
          await setSelect('.tc-analyst-controls select', 0, 'n:0');
          await setSelect('.tc-analyst-controls select', 1, 'n:3');
          await waitShadowText('CREATED');

          await clickShadow('[role="treeitem"]', '●AurealSCH');
          await clickShadow('.tc-analyst-tab', 'DELTA');
          await setSelect('.tc-analyst-controls select', 0, 'n:121');
          await setSelect('.tc-analyst-controls select', 1, 'n:170');
          await waitShadowText('TRANSFORMED');
          await waitShadowText('COLLAPSE');

          await clickShadow('.tc-analyst-tab', 'TRUTH');
          await waitShadowText('Truth Lattice');
          await waitShadowText('existence');

          await clickShadow('.tc-analyst-tab', 'GAPS');
          await waitShadowText('Knowledge Gaps');
          await waitShadowText('UNKNOWN');

          await clickShadow('.tc-analyst-tab', 'QUERY');
          await setSelect('.tc-analyst-card select', 0, 'collapse-affected');
          await waitShadowText('Affected by Starsilk extraction collapse');
          await waitShadowText('Aureal');

          const analystVisible = await page.evaluate(() => {
            const root = document.querySelector('starsilk-starmap-host')?.shadowRoot;
            const panel = root?.querySelector('.tc-analyst-panel');
            return panel instanceof HTMLElement && !panel.hidden;
          });
          if (!analystVisible) throw new Error('Analyst panel is not visible inside the editor shadow boundary');

          if (consoleErrors.length) {
            throw new Error(`Browser console/page errors:\n${consoleErrors.join('\n')}`);
          }
          await browser.close();
          NODE

      - name: Diff hygiene
        working-directory: .
        run: git diff --check
