name: Phase 7 generate and validate

on:
  push:
    branches: [phase-07-faceted-discovery]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !startsWith(github.event.head_commit.message, 'Implement Phase 7 faceted discovery') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-07-faceted-discovery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Apply Phase 7 source patch
        run: python3 tools/phase7_apply.py
      - name: Generate and validate deterministic publication
        run: ./tools/build.sh
      - name: Focused Phase 7 tests
        run: python3 -m pytest tests/test_discovery.py -q
      - name: Deterministic check
        run: ./tools/build.sh --check
      - name: Diff whitespace check
        run: git diff --check
      - name: Remove temporary execution helpers
        run: rm tools/phase7_apply.py .github/workflows/phase7-generate.yml
      - name: Commit implementation and generated derivatives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':(exclude)docs/qa-report.txt'
          if git diff --cached --quiet; then
            echo 'No Phase 7 changes to commit.'
            exit 0
          fi
          git commit -m 'Implement Phase 7 faceted discovery'
          git push origin HEAD:phase-07-faceted-discovery
