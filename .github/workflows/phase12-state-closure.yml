name: Phase 12 state closure

on:
  push:
    branches: [phase-12-state-closure]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-state-closure
          fetch-depth: 0

      - name: Record verified Phase 12 completion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('MUSEUM_AI_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '| 12 | AI Agent Evaluation Harness and Final Integration | NOT STARTED | — | deferred |'
          new = '| 12 | AI Agent Evaluation Harness and Final Integration | COMPLETE | PR #39; clean head `6c7eed86f60ce1eb36d4b53b29f8776b356fbf00`; CI `32676564639` PASS; merged `3431f14941f20a0105ac70275360d6aaa07f6014`; live proof PR #40 / run `32676803602` PASS | none |'
          if old not in text and new not in text:
              raise SystemExit('Phase 12 ledger row not found')
          text = text.replace(old, new, 1)
          record = '''

### Phase 12 — AI Agent Evaluation Harness and Final Integration

#### Completion record

- starting `main`: `b357f182b072837b008f9b637a79a89678893e24`
- work branch: `phase-12-agent-evaluation-final-integration`
- verified generated implementation commit: `2fad67c50193d7fead2382e2c909017abb2bc784`
- clean final PR head after removal of the temporary generation runner: `6c7eed86f60ce1eb36d4b53b29f8776b356fbf00`
- implementation PR: `#39`
- successful required CI: run `32676564639`; Chromium build/parity/unit/accessibility/network suite PASS; Firefox representative journeys PASS; WebKit representative journeys PASS
- implementation merge on `main`: `3431f14941f20a0105ac70275360d6aaa07f6014`
- execution-only live proof PR: `#40`, closed unmerged by design
- successful live Pages proof: run `32676803602`, job `97286337702`
- live proof fetched and validated `/agents/AGENT_GUIDE.md`, `/agents/evaluation.json`, `/agents/integration.json`, `/machine/index.json`, and `/llms.txt`
- evaluation contract: 13 required vendor-neutral reference categories and 7 explicit failure penalties
- deterministic final-integration certificate: 10/10 checks PASS, covering stable entity identity, context packets, relationship evidence boundaries, media provenance, chronology unknowns, WorldsVault no-false-precision, browser-local tour state, offline scope, agent entry points, and evaluation contract
- final integration repair: machine-publication schema/test expectations were brought into parity with already-published chronology/WorldsVault endpoints and the new Phase 12 agent surfaces; no canon prose, media source, backend, dependency, or public redesign was introduced
- public boundary: build gate PASS; generated derivatives remain subordinate to their cited authored sources

**Completion verdict: VERIFIED. The twelve-phase Museum + AI program is complete.**
'''
          if '### Phase 12 — AI Agent Evaluation Harness and Final Integration' not in text:
              text = text.rstrip() + record
          roadmap.write_text(text.rstrip() + '\n', encoding='utf-8')

          state = Path('OPERATIONAL_STATE.md')
          text = state.read_text(encoding='utf-8')
          if 'revision: 17' in text:
              text = text.replace('revision: 17', 'revision: 18', 1)
          section = '''

## Revision 18 — Phase 12 verified; twelve-phase program complete

- Museum + AI Phase 12 implementation PR #39 merged to `main` at `3431f14941f20a0105ac70275360d6aaa07f6014`.
- Final clean implementation head `6c7eed86f60ce1eb36d4b53b29f8776b356fbf00` passed required CI run `32676564639`: deterministic build/source parity, full Chromium pytest + Playwright accessibility/network coverage, Firefox representative journeys, and WebKit representative journeys all passed.
- Independent live Pages proof PR #40 was closed unmerged by design after run `32676803602` / job `97286337702` passed against the deployed site.
- Live Phase 12 artifacts verified: `/agents/AGENT_GUIDE.md`, `/agents/evaluation.json`, `/agents/integration.json`, `/machine/index.json`, and `/llms.txt`.
- `docs/agents/integration.json` reports `overall_status=pass`, `pass_count=10`, `fail_count=0`.
- `docs/agents/evaluation.json` contains all 13 required vendor-neutral evaluation categories and all 7 required explicit failure penalties.
- Agent guidance preserves authority hierarchy, stable IDs, independent canon/spoiler/visibility metadata, unknown state, observed-mention semantics, media provenance, and source references; generated derivatives do not outrank cited authored sources.
- The final integration repair changed only Phase 12 publication/schema/test integration. It did not redesign the Compendium, create a backend, add a dependency, mutate canonical media sources, or rewrite canon prose.
- Phase ledger status: 12 / 12 COMPLETE. No subsequent numbered phase exists in this program.
'''
          if '## Revision 18 — Phase 12 verified; twelve-phase program complete' not in text:
              text = text.rstrip() + section
          state.write_text(text.rstrip() + '\n', encoding='utf-8')

          bible = Path('Starsilk_Character_Dossier_bible.md')
          text = bible.read_text(encoding='utf-8')
          entry = '''

## 2026-08-23 — Museum + AI Phase 12 final closure

Phase 12, **AI Agent Evaluation Harness and Final Integration**, is VERIFIED COMPLETE. PR #39 merged at `3431f14941f20a0105ac70275360d6aaa07f6014` after clean-head CI `32676564639` passed Chromium build/parity/unit/accessibility/network tests plus Firefox and WebKit journeys. Independent live Pages proof PR #40 was closed unmerged after run `32676803602` passed against the deployed Phase 12 agent surfaces. The public agent layer is a deterministic derivative, not a new canon authority: 13 vendor-neutral evaluation categories, 7 explicit inference/status/provenance penalties, and a 10/10 final-integration certificate. The twelve-phase Museum + AI program is now complete; do not invent a Phase 13.
'''
          if '## 2026-08-23 — Museum + AI Phase 12 final closure' not in text:
              text = text.rstrip() + entry
          bible.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

          git diff --check
          git diff --exit-code -- docs/ || true

      - name: Commit state closure
        shell: bash
        run: |
          git config user.name "WestKitty"
          git config user.email "westkitty@users.noreply.github.com"
          git add MUSEUM_AI_ROADMAP.md OPERATIONAL_STATE.md Starsilk_Character_Dossier_bible.md
          if git diff --cached --quiet; then
            echo 'State closure already recorded.'
            exit 0
          fi
          git commit -m "docs(phase-12): record verified final completion"
          git push origin HEAD:phase-12-state-closure
