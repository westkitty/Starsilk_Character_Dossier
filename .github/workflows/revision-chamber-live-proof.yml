name: Revision Chamber live proof

on:
  push:
    branches: [feature/revision-chamber]
    paths:
      - '.github/workflows/revision-chamber-live-proof.yml'

permissions:
  contents: read

jobs:
  live-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact published main
        uses: actions/checkout@v4
        with:
          ref: 866e8bc5dc514c9b71a90b63d8122db4a4668471

      - name: Prove live Revision Chamber byte parity and payload
        run: |
          set -euo pipefail
          base='https://westkitty.github.io/Starsilk_Character_Dossier'
          stamp="866e8bc5dc514c9b71a90b63d8122db4a4668471-$(date +%s)"
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${base}/?revision_proof=${stamp}" --output /tmp/live-index.html
          curl --fail --silent --show-error --location -H 'Cache-Control: no-cache' \
            "${base}/service-worker.js?revision_proof=${stamp}" --output /tmp/live-service-worker.js
          cmp --silent docs/index.html /tmp/live-index.html
          cmp --silent docs/service-worker.js /tmp/live-service-worker.js
          grep -Fq 'id="revisionChamber"' /tmp/live-index.html
          grep -Fq 'Plan the rewrite. Do not touch reality.' /tmp/live-index.html
          grep -Fq 'What would I have to sacrifice?' /tmp/live-index.html
          python3 - <<'PY'
          import base64, hashlib, json, re
          from pathlib import Path

          live = Path('/tmp/live-index.html').read_bytes()
          expected = Path('docs/index.html').read_bytes()
          sw_live = Path('/tmp/live-service-worker.js').read_bytes()
          sw_expected = Path('docs/service-worker.js').read_bytes()
          assert live == expected
          assert sw_live == sw_expected
          text = live.decode('utf-8')
          match = re.search(r'window\.STARSILK_REVISION_DATA=JSON\.parse\(new TextDecoder\(\)\.decode\(Uint8Array\.from\(atob\("([A-Za-z0-9+/=]+)"\)', text)
          assert match, 'Revision data payload not found'
          payload = json.loads(base64.b64decode(match.group(1)).decode('utf-8'))
          assert payload['schema'] == 'starsilk-revision-data/1'
          assert 'human canon judgment remains required' in payload['authority_note'].lower()
          print('root_sha256=' + hashlib.sha256(live).hexdigest())
          print('service_worker_sha256=' + hashlib.sha256(sw_live).hexdigest())
          print('revision_schema=' + payload['schema'])
          print('revision_records=' + str(len(payload.get('records', []))))
          print('revision_locks=' + str(len(payload.get('locks', []))))
          print('revision_events=' + str(len(payload.get('events', []))))
          print('LIVE REVISION CHAMBER PROOF PASS')
          PY
