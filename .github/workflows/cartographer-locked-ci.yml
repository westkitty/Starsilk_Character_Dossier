name: Cartographer Locked Clean Build

on:
  push:
    branches:
      - validation/temporal-cartographer-optimal-ci-2026-09-08
    paths:
      - '.github/workflows/cartographer-locked-ci.yml'

permissions:
  contents: read

jobs:
  locked-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cartographer
    steps:
      - name: Checkout locked synthesis
        uses: actions/checkout@v4
        with:
          ref: validation/temporal-cartographer-optimal-ci-2026-09-08

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cartographer/package-lock.json

      - name: Install exact locked graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Diff hygiene
        working-directory: .
        run: git diff --check
