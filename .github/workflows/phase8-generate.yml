name: Phase 8 generate and validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-tours-local-collections
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and focused browser
        run: |
          python3 -m pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Apply Phase 8 implementation
        run: |
          python3 tools/phase8_apply.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_tours.py')
          text = path.read_text(encoding='utf-8')
          old = '    page.locator("#openSelected").click()\n    expect(page).to_have_url(f"{local_server}/entities/codec/")'
          new = '    page.locator("#libraryRecord").select_option("codec")\n    page.locator("#openSelected").click()\n    expect(page).to_have_url(f"{local_server}/entities/codec/")'
          if text.count(old) != 1:
              raise SystemExit(f'expected one test adjustment anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Build publication
        run: ./tools/build.sh
      - name: Focused Phase 8 tests
        run: python3 -m pytest tests/test_tours.py -q
      - name: Deterministic build check
        run: ./tools/build.sh --check
      - name: Diff hygiene
        run: git diff --check
      - name: Remove temporary execution helpers
        run: rm tools/phase8_apply.py .github/workflows/phase8-generate.yml
      - name: Commit implementation and generated derivatives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':(exclude)docs/qa-report.txt'
          git commit -m 'Implement Phase 8 curated tours and local collections'
          git push origin HEAD:phase-08-tours-local-collections
