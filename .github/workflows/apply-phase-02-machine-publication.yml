name: Produce Phase 02 machine publication artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repository dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Generate and validate Phase 2 publication
        run: ./tools/build.sh

      - name: Focused Phase 2 tests
        run: python3 -m pytest tests/test_machine_publication.py -q

      - name: Diff hygiene
        run: git diff --check

      - name: Upload generated machine publication
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-generated-publication
          path: |
            docs/machine/
            docs/llms.txt
            docs/sitemap.xml
          if-no-files-found: error
          retention-days: 1
