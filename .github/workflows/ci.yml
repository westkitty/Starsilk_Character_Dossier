name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-validate:
    name: Build, validate, unit + accessibility/network tests (Chromium)
    runs-on: ubuntu-latest
    # Visual references are generated deliberately inside this exact pinned
    # Playwright container. Visual tests wait for target images to load/decode
    # before capture, so native lazy loading cannot create false regressions.
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build from source (no media regeneration required)
        run: ./tools/build.sh

      - name: Prove the checked-in deployable docs/ matches its declared sources
        run: |
          ./tools/build.sh --check
          # qa-report.txt records runner capabilities (for example Node availability)
          # and is validation telemetry, not authoritative deployable source output.
          git diff --exit-code -- docs/ ':(exclude)docs/qa-report.txt' || {
            echo "::error::Build produced uncommitted differences in deployable docs/ -- the checked-in site and its generator have diverged.";
            exit 1;
          }

      - name: git diff --check (no whitespace-corrupt diffs)
        run: git diff --check

      - name: Full pytest + Playwright suite (Chromium)
        run: python3 -m pytest tests/ -q

      - name: Upload failed visual-regression captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: tests/visual_baselines/FAILED-*.png
          if-no-files-found: ignore

  cross-browser:
    name: Representative journeys (Firefox, WebKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: .venv/bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Build from source
        run: ./tools/build.sh

      - name: Representative cross-browser journeys
        run: .venv/bin/pytest tests/test_cross_browser.py --browser ${{ matrix.browser }} -q

  phase-12-state-closure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Record verified Phase 12 state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-12-state-closure
          fetch-depth: 0

      - name: Patch durable state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roadmap = Path('MUSEUM_AI_ROADMAP.md')
          text = roadmap.read_text(encoding='utf-8')
          old = '| 12 | AI Agent Evaluation Harness and Final Integration | NOT STARTED | — | deferred |'
          new = '| 12 | AI Agent Evaluation Harness and Final Integration | COMPLETE | PR #39; clean head `6c7eed86f60ce1eb36d4b53b29f8776b356fbf00`; CI `32676564639` PASS; merged `3431f14941f20a0105ac70275360d6aaa07f6014`; live proof PR #40 / run `32676803602` PASS | none |'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Phase 12 ledger row not found')
          if '### Phase 12 — AI Agent Evaluation Harness and Final Integration' not in text:
              text = text.rstrip() + '''

### Phase 12 — AI Agent Evaluation Harness and Final Integration

#### Completion record

- starting `main`: `b357f182b072837b008f9b637a79a89678893e24`
- work branch: `phase-12-agent-evaluation-final-integration`
- verified generated implementation commit: `2fad67c50193d7fead2382e2c909017abb2bc784`
- clean final PR head: `6c7eed86f60ce1eb36d4b53b29f8776b356fbf00`
- implementation PR: `#39`
- successful required CI: run `32676564639`; Chromium build/parity/unit/accessibility/network PASS; Firefox PASS; WebKit PASS
- implementation merge on `main`: `3431f14941f20a0105ac70275360d6aaa07f6014`
- execution-only live proof PR: `#40`, closed unmerged by design
- successful live Pages proof: run `32676803602`, job `97286337702`
- live proof validated `/agents/AGENT_GUIDE.md`, `/agents/evaluation.json`, `/agents/integration.json`, `/machine/index.json`, and `/llms.txt`
- evaluation contract: all 13 required vendor-neutral categories and all 7 required failure penalties
- deterministic final-integration certificate: 10/10 checks PASS
- public boundary: PASS; generated derivatives remain subordinate to cited authored sources

**Completion verdict: VERIFIED. The twelve-phase Museum + AI program is complete.**
'''
          roadmap.write_text(text.rstrip() + '\n', encoding='utf-8')

          state = Path('OPERATIONAL_STATE.md')
          text = state.read_text(encoding='utf-8')
          text = text.replace('revision: 17', 'revision: 18', 1)
          if '## Revision 18 — Phase 12 verified; twelve-phase program complete' not in text:
              text = text.rstrip() + '''

## Revision 18 — Phase 12 verified; twelve-phase program complete

- Museum + AI Phase 12 PR #39 merged to `main` at `3431f14941f20a0105ac70275360d6aaa07f6014`.
- Clean implementation head `6c7eed86f60ce1eb36d4b53b29f8776b356fbf00` passed CI run `32676564639`: deterministic build/source parity, Chromium pytest + Playwright accessibility/network coverage, Firefox journeys, and WebKit journeys all passed.
- Independent live Pages proof PR #40 was closed unmerged after run `32676803602` / job `97286337702` passed against the deployed site.
- Live Phase 12 artifacts verified: `/agents/AGENT_GUIDE.md`, `/agents/evaluation.json`, `/agents/integration.json`, `/machine/index.json`, and `/llms.txt`.
- `docs/agents/integration.json`: `overall_status=pass`, 10/10 checks, 0 failures.
- `docs/agents/evaluation.json`: all 13 required categories and all 7 explicit failure penalties.
- Agent guidance preserves authority, stable IDs, independent status metadata, unknown state, relationship semantics, media provenance, and source references; generated derivatives do not outrank cited authored sources.
- Phase ledger status: 12 / 12 COMPLETE. No subsequent numbered phase exists in this program.
'''
          state.write_text(text.rstrip() + '\n', encoding='utf-8')

          bible = Path('Starsilk_Character_Dossier_bible.md')
          text = bible.read_text(encoding='utf-8')
          if '## 2026-08-23 — Museum + AI Phase 12 final closure' not in text:
              text = text.rstrip() + '''

## 2026-08-23 — Museum + AI Phase 12 final closure

Phase 12, **AI Agent Evaluation Harness and Final Integration**, is VERIFIED COMPLETE. PR #39 merged at `3431f14941f20a0105ac70275360d6aaa07f6014`; clean-head CI `32676564639` passed Chromium build/parity/unit/accessibility/network tests plus Firefox and WebKit journeys; independent live Pages proof PR #40 closed unmerged after run `32676803602` passed. The public agent layer remains a deterministic derivative, not a canon authority: 13 vendor-neutral evaluation categories, 7 explicit failure penalties, and a 10/10 final-integration certificate. The twelve-phase Museum + AI program is complete; do not invent a Phase 13.
'''
          bible.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check

      - name: Commit closure to closure branch
        shell: bash
        run: |
          git config user.name "WestKitty"
          git config user.email "westkitty@users.noreply.github.com"
          git add MUSEUM_AI_ROADMAP.md OPERATIONAL_STATE.md Starsilk_Character_Dossier_bible.md
          if git diff --cached --quiet; then
            echo 'State closure already recorded.'
            exit 0
          fi
          git commit -m "docs(phase-12): record verified final completion"
          git push origin HEAD:phase-12-state-closure
