name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    name: Build, validate, unit + accessibility/network tests (Chromium)
    runs-on: ubuntu-latest
    # Screenshot regression is only meaningfully stable when every run
    # renders fonts the same way -- text-rendering differs enough between
    # host OSes that a bare ubuntu-latest runner would drift from the
    # committed baselines through no real design change of its own. Pinning
    # the official Playwright container (matching requirements.txt's
    # playwright version) is Microsoft's own documented fix for this.
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build from source (no media regeneration required)
        run: ./tools/build.sh

      # Temporary source-sync evidence: upload the page produced by the real
      # generator so the branch can commit that exact disposable output.
      # Removed before merge after docs/index.html is synchronized.
      - name: Upload regenerated page candidate
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-page-candidate
          path: docs/index.html
          if-no-files-found: error

      - name: Prove the checked-in deployable docs/ matches its declared sources
        run: |
          ./tools/build.sh --check
          # qa-report.txt records runner capabilities (for example Node availability)
          # and is validation telemetry, not authoritative deployable source output.
          git diff --exit-code -- docs/ ':(exclude)docs/qa-report.txt' || {
            echo "::error::Build produced uncommitted differences in deployable docs/ -- the checked-in site and its generator have diverged.";
            exit 1;
          }

      - name: git diff --check (no whitespace-corrupt diffs)
        run: git diff --check

      # One-shot migration step for this branch: render references inside the
      # exact pinned Linux container that owns visual-regression comparisons.
      # These candidates are inspected and committed, then this capture step
      # is removed before merge. UPDATE_VISUAL_BASELINES is never set in the
      # normal final CI path.
      - name: Capture pinned visual baseline candidates
        env:
          UPDATE_VISUAL_BASELINES: "1"
        run: python3 -m pytest tests/test_dossier.py -q -k 'test_visual_'

      - name: Upload pinned visual baseline candidates
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidates
          path: tests/visual_baselines/*.png
          if-no-files-found: error

      - name: Full pytest + Playwright suite (Chromium)
        run: python3 -m pytest tests/ -q

      - name: Upload failed visual-regression captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: tests/visual_baselines/FAILED-*.png
          if-no-files-found: ignore

  cross-browser:
    name: Representative journeys (Firefox, WebKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: .venv/bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Build from source
        run: ./tools/build.sh

      - name: Representative cross-browser journeys
        run: .venv/bin/pytest tests/test_cross_browser.py --browser ${{ matrix.browser }} -q
