name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    name: Build, validate, unit + accessibility/network tests (Chromium)
    runs-on: ubuntu-latest
    # Visual references are generated deliberately inside this exact pinned
    # Playwright container. Visual tests wait for target images to load/decode
    # before capture, so native lazy loading cannot create false regressions.
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build from source (no media regeneration required)
        run: ./tools/build.sh

      - name: Prove the checked-in deployable docs/ matches its declared sources
        run: |
          ./tools/build.sh --check
          # qa-report.txt records runner capabilities (for example Node availability)
          # and is validation telemetry, not authoritative deployable source output.
          git diff --exit-code -- docs/ ':(exclude)docs/qa-report.txt' || {
            echo "::error::Build produced uncommitted differences in deployable docs/ -- the checked-in site and its generator have diverged.";
            exit 1;
          }

      - name: git diff --check (no whitespace-corrupt diffs)
        run: git diff --check

      - name: Full pytest + Playwright suite (Chromium)
        run: python3 -m pytest tests/ -q

      - name: Upload failed visual-regression captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: tests/visual_baselines/FAILED-*.png
          if-no-files-found: ignore

  cross-browser:
    name: Representative journeys (Firefox, WebKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: .venv/bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Build from source
        run: ./tools/build.sh

      - name: Representative cross-browser journeys
        run: .venv/bin/pytest tests/test_cross_browser.py --browser ${{ matrix.browser }} -q

  record-pr47-operational-state:
    name: Record PR47 operational state
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 47 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch durable state ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('OPERATIONAL_STATE.md')
          text = p.read_text(encoding='utf-8')
          def once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'missing OPERATIONAL_STATE marker: {old[:140]!r}')
              text = text.replace(old, new, 1)
          once('revision: 20', 'revision: 21')
          phase9 = '- Museum + AI Phase 9 PR #34 merged at `3ed684897975065d89f5e12c8c15b36f936c0262`.\n'
          visual_line = '- Visual-coverage work unit PR #47 (`repair/visual-coverage-provenance`) is source/build/docs verified at revision 21: clean read-only CI run `32738410496` passed Chromium, Firefox, and WebKit on implementation head `e81aacafac80de3542ce1c466de8b8df2434bfce`. Merge state, Pages publication, and live-edge content remain separate proof states under invariant 10.\n'
          once(phase9, phase9 + visual_line)
          old47 = '47. Physical Compendium xrefs must retain deterministic public evidence anchors. Relationship edges may cite the first qualifying rendered xref inside the established source-section subtree projection; this evidence identity must not change the existing 136-edge graph contract.'
          new47 = '47. Physical Compendium xrefs must retain deterministic public evidence anchors. Relationship edges may cite the first qualifying rendered xref inside the established source-section subtree projection; edge identity and observed-xref semantics are stable, while the generated relationship count is derived from authored xrefs rather than frozen as a historical literal. The verified PR #47 output remains at the pre-change source-derived 138 observed `mentions` edges.'
          once(old47, new47)
          invariant70 = '70. The root museum entrance is presentation over the existing Compendium, not a second content or authority surface. It must not invent canon, relationships, chronology, or WorldsVault facts; its statistics must remain derived from existing source/generated data; and the full, unabridged Compendium plus every legacy `/#stable-id` anchor must remain intact below it.'
          additions = '\n'.join([
              '71. `src/content/visual-coverage.json` is presentation-only fallback placement authority for authored top-level records that lack a visible authored image. Every referenced `source_filename` must already exist in `docs/asset-manifest.json`; the map cannot create canon, media provenance, semantic relationships, dates, locations, identities, or unauthored appearances.',
              '72. Every one of the 127 authored top-level records must retain locally resolvable image coverage on both the complete Compendium and its canonical `/entities/<stable-id>/` page. Existing authored visuals take precedence; fallbacks are additive only for image-less authored bodies. The cover may satisfy this contract through the existing local poster frame attached to its hero video.',
              '73. Character context fallbacks must explicitly state that they are not portraits so unknown appearance remains unknown. Fallback presentation must not create `.xref-link` evidence or alter the observed-xref relationship graph; manifest-derived `related_media_ids` remain governed by invariant 30.',
              '74. Visual-coverage completion must not add or replace canonical media binaries, write back to `media/source/`, or weaken provenance checks. Any deliberately changed visual-regression baseline must be generated and immediately re-compared inside the pinned Playwright Linux environment before merge.',
          ])
          once(invariant70, invariant70 + '\n' + additions)
          marker = '\n## Verified implementation\n'
          verified = '\n'.join([
              '## Visual coverage completion — VERIFIED ON PR #47',
              '',
              '- Implementation head `e81aacafac80de3542ce1c466de8b8df2434bfce` passed clean read-only CI run `32738410496`: deterministic build/check and deployable `docs/` parity, `git diff --check`, full Chromium pytest + Playwright, Firefox, and WebKit all passed.',
              '- Strict validation on the completed publication reports 0 duplicate IDs, 0 broken anchors, 0 missing local assets, 0 data URIs, 0 local machine-path leaks, 0 external runtime dependencies, 16 canon locks with 0 violations, 36 Drakken identity assertions with 0 failures, and 0 manifest-invariant errors.',
              '- The visual-coverage regression contract requires all 127 authored records to have locally resolvable image coverage on both root and canonical entity pages, while preserving source-text authority and explicit unknown appearances.',
              '- The generated relationship graph remains at 138 source-derived `kind=mentions` / `evidence_class=observed-xref` edges; fallback captions are regression-locked against creating relationship evidence.',
              '- No new media binary is introduced by the visual-coverage map. The one changed peripheral visual baseline was regenerated in the pinned Playwright Linux container and immediately re-compared successfully.',
              '- PR merge state and live GitHub Pages publication are intentionally not inferred from this verification record; they require separate proof under invariant 10.',
              '',
          ])
          once(marker, '\n' + verified + marker)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit state ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPERATIONAL_STATE.md
          if git diff --cached --quiet; then
            echo "Operational state already matches verified contract."
            exit 0
          fi
          git commit -m "docs: record PR47 visual coverage state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
