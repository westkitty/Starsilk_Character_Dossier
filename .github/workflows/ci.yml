name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-validate:
    name: Build, validate, unit + accessibility/network tests (Chromium)
    runs-on: ubuntu-latest
    # Visual references are generated deliberately inside this exact pinned
    # Playwright container. Visual tests wait for target images to load/decode
    # before capture, so native lazy loading cannot create false regressions.
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build from source (no media regeneration required)
        run: ./tools/build.sh

      - name: Prove the checked-in deployable docs/ matches its declared sources
        run: |
          ./tools/build.sh --check
          # qa-report.txt records runner capabilities (for example Node availability)
          # and is validation telemetry, not authoritative deployable source output.
          git diff --exit-code -- docs/ ':(exclude)docs/qa-report.txt' || {
            echo "::error::Build produced uncommitted differences in deployable docs/ -- the checked-in site and its generator have diverged.";
            exit 1;
          }

      - name: git diff --check (no whitespace-corrupt diffs)
        run: git diff --check

      - name: Full pytest + Playwright suite (Chromium)
        run: python3 -m pytest tests/ -q

      - name: Upload failed visual-regression captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: tests/visual_baselines/FAILED-*.png
          if-no-files-found: ignore

  cross-browser:
    name: Representative journeys (Firefox, WebKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: .venv/bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Build from source
        run: ./tools/build.sh

      - name: Representative cross-browser journeys
        run: .venv/bin/pytest tests/test_cross_browser.py --browser ${{ matrix.browser }} -q

  close-phase-05-state:
    name: Temporary Phase 05 state closure
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'phase-05-state-closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply and validate state closure
        run: |
          python3 tools/close_phase05_state.py
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "MUSEUM_AI_ROADMAP.md
          OPERATIONAL_STATE.md"

      - name: Commit exact state closure
        run: |
          if git diff --quiet -- MUSEUM_AI_ROADMAP.md OPERATIONAL_STATE.md; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MUSEUM_AI_ROADMAP.md OPERATIONAL_STATE.md
          git diff --cached --check
          git commit -m "docs(phase-05): close roadmap and operational state"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
