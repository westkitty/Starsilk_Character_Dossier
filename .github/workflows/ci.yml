name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    name: Build, validate, unit + accessibility/network tests (Chromium)
    runs-on: ubuntu-latest
    # Visual references are generated deliberately inside this exact pinned
    # Playwright container. Visual tests wait for target images to load/decode
    # before capture, so native lazy loading cannot create false regressions.
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build from source (no media regeneration required)
        run: ./tools/build.sh

      - name: Prove the checked-in deployable docs/ matches its declared sources
        run: |
          ./tools/build.sh --check
          # qa-report.txt records runner capabilities (for example Node availability)
          # and is validation telemetry, not authoritative deployable source output.
          git diff --exit-code -- docs/ ':(exclude)docs/qa-report.txt' || {
            echo "::error::Build produced uncommitted differences in deployable docs/ -- the checked-in site and its generator have diverged.";
            exit 1;
          }

      - name: git diff --check (no whitespace-corrupt diffs)
        run: git diff --check

      - name: Full pytest + Playwright suite (Chromium)
        run: python3 -m pytest tests/ -q

      - name: Upload failed visual-regression captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: tests/visual_baselines/FAILED-*.png
          if-no-files-found: ignore

  cross-browser:
    name: Representative journeys (Firefox, WebKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: .venv/bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Build from source
        run: ./tools/build.sh

      - name: Representative cross-browser journeys
        run: .venv/bin/pytest tests/test_cross_browser.py --browser ${{ matrix.browser }} -q

  record-pr46-operational-state:
    name: Record PR46 operational state
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 46 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update durable project ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('OPERATIONAL_STATE.md')
          text = p.read_text(encoding='utf-8')

          def once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'missing OPERATIONAL_STATE marker: {old[:120]!r}')
              text = text.replace(old, new, 1)

          once('revision: 20', 'revision: 21')
          phase9 = '- Museum + AI Phase 9 PR #34 merged at `3ed684897975065d89f5e12c8c15b36f936c0262`.\n'
          once(phase9, phase9 + '- Canon + entrance PR #46 (`canon/wordstreaming-post-wall-hardening`) is the active verified work unit at revision 21: cleaned production CI run `32702597799` passed Chromium, Firefox, and WebKit on head `cc660edb18cabd689cf25c973759f6b1801b5448`. At ledger write time the PR is still pre-merge; merge and live Pages publication remain separate proof states under invariant 10.\n')
          once(
              '- Root hero statistics in `shell.html.j2` (`museum_stats`, computed in `build/generate.py::load_museum_stats`) are derived from `sections.json`, `docs/asset-manifest.json`, `src/tours/tours.json`, `src/chronology/events.json`, and `src/canon/invariants.json` at build time; they are never hand-maintained literals and must not be edited directly in generated output.',
              '- Archive-junction statistics in `shell.html.j2` (`museum_stats`, computed in `build/generate.py::load_museum_stats`) are derived from `sections.json`, `docs/asset-manifest.json`, `src/tours/tours.json`, `src/chronology/events.json`, and `src/canon/invariants.json` at build time; they are never hand-maintained literals and must not be edited directly in generated output.'
          )
          once(
              '8. Visual regression references belong to the pinned Playwright Linux environment; visual captures must wait for target images to load and decode rather than depending on lazy-load timing.',
              '8. Visual regression references belong to the pinned Playwright Linux environment; captures must wait for target images to load/decode and must pause/pin decorative video before screenshots so ambient frame timing cannot masquerade as a layout regression.'
          )
          once(
              '47. Physical Compendium xrefs must retain deterministic public evidence anchors. Relationship edges may cite the first qualifying rendered xref inside the established source-section subtree projection; this evidence identity must not change the existing 136-edge graph contract.',
              '47. Physical Compendium xrefs must retain deterministic public evidence anchors. Relationship edges may cite the first qualifying rendered xref inside the established source-section subtree projection; edge identity and observed-xref semantics are stable, while the generated relationship count is derived from authored xrefs and must not be frozen as a historical literal in regression tests.'
          )
          once(
              '70. The root museum entrance is presentation over the existing Compendium, not a second content or authority surface. It must not invent canon, relationships, chronology, or WorldsVault facts; its statistics must remain derived from existing source/generated data; and the full, unabridged Compendium plus every legacy `/#stable-id` anchor must remain intact below it.',
              '70. The root threshold is Starsilk-first presentation over the existing Compendium, not a second content or authority surface. The cover leads with the programmable-substrate premise and three source-backed entry paths; archive/machine lenses move to a compact junction after the first cosmology folio. Neither surface may invent canon, relationships, chronology, or WorldsVault facts, and the full Compendium plus every legacy `/#stable-id` anchor must remain intact.'
          )
          marker = '\n## Verified implementation\n'
          additions = '''
71. The current Canon Inspector publishes 16 machine-enforced locks derived from `src/canon/invariants.json` (3 document locks and 13 section locks). Tests must derive lock totals from that authority rather than preserve the historical 11-lock count.
72. Wordstreaming is a living communication and reality-code practice named for the deceased Wordstreamer; her death does not terminate the practice, and post-Wall Drakken can still wordstream directly.
73. Post-Wall canon locks include Codec's roughly 8,560-year elapsed-time estimate and modern Drakken remaining larger than humans while substantially smaller than Blood Eclipse War Titans.
74. The cover-title canon intrusion is sparse and page-lifetime local: `YOUR SKY IS BUILT FROM YOUR DEAD.` leads a no-immediate-repeat pool on an approximately 38–55 second cadence. Reduced-motion replaces the flash with a steady hold, and narrow viewports must wrap the intrusion without clipping or horizontal overflow while the normal `Starsilk Compendium` title retains its one-line contract.
75. Entrance redesign must preserve the existing hero-video lifecycle, search, sidebar/navigation, Archive Tools session behavior, offline publication, stable IDs, and observed-xref evidence. New cover reference anchors exist to preserve those established evidence links rather than silently deleting graph edges.

## Canon + entrance hardening — VERIFIED ON PR #46

- Cleaned production CI run `32702597799` passed the full Chromium pytest/Playwright suite and the representative Firefox and WebKit journeys on head `cc660edb18cabd689cf25c973759f6b1801b5448`.
- Deterministic build/check, deployable `docs/` parity, `git diff --check`, strict validation, and public-boundary validation passed. Strict validation reported 16 canon locks with 0 violations, 0 duplicate IDs, 0 broken anchors, 0 missing local assets, 0 local path leaks, and 0 external runtime dependencies.
- The visual-regression harness now freezes decorative video before non-cover captures. Four affected references were regenerated once inside the pinned Playwright container and immediately re-compared successfully before commit.
- The relationship graph remains `kind=mentions` / `evidence_class=observed-xref`; its current count is 138 and is intentionally derived rather than asserted as a permanent semantic invariant.
- PR #46 remains pre-merge at this ledger revision. Do not infer merge, Pages build completion, or live-edge publication from this verification record.
'''
          once(marker, '\n' + additions + marker)
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Commit ledger update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPERATIONAL_STATE.md
          git diff --cached --exit-code && exit 0 || true
          git commit -m "docs: record PR46 verified operational state"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
