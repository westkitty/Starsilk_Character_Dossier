name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    name: Build, validate, unit + accessibility/network tests (Chromium)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Build from source (no media regeneration required)
        run: ./tools/build.sh
      - name: Prove the checked-in deployable docs/ matches its declared sources
        run: |
          ./tools/build.sh --check
          git diff --exit-code -- docs/ ':(exclude)docs/qa-report.txt' || {
            echo "::error::Build produced uncommitted differences in deployable docs/ -- the checked-in site and its generator have diverged.";
            exit 1;
          }
      - name: git diff --check (no whitespace-corrupt diffs)
        run: git diff --check
      - name: Full pytest + Playwright suite (Chromium)
        run: python3 -m pytest tests/ -q
      - name: Upload failed visual-regression captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: tests/visual_baselines/FAILED-*.png
          if-no-files-found: ignore

  cross-browser:
    name: Representative journeys (Firefox, WebKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install Playwright browser (${{ matrix.browser }})
        run: .venv/bin/playwright install --with-deps ${{ matrix.browser }}
      - name: Build from source
        run: ./tools/build.sh
      - name: Representative cross-browser journeys
        run: .venv/bin/pytest tests/test_cross_browser.py --browser ${{ matrix.browser }} -q

  regen-pr46:
    name: Regenerate PR46 source derivatives
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 46 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Trust worktree
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Rebuild and verify relationship preservation
        run: |
          ./tools/build.sh
          ./tools/build.sh --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          rel = json.loads(Path('docs/relationships/relationships.json').read_text())
          cover = next(e for e in rel['entities'] if e['stable_id'] == 'cover')
          assert cover['outgoing_count'] == 9, cover
          integration = json.loads(Path('docs/agents/integration.json').read_text())
          text = json.dumps(integration)
          assert 'relationships=138 kind=mentions evidence=observed-xref' in text, text
          canon = json.loads(Path('docs/canon/canon-locks.json').read_text())
          assert canon['lock_count'] == 16, canon['lock_count']
          PY
          python3 -m pytest tests/test_entrance_intrusion.py tests/test_canon_inspector.py -q
          python3 -m pytest tests/test_dossier.py::test_watermark_pauses_while_cover_dominant tests/test_unified_museum_shell.py -q
          git diff --check
      - name: Refresh intentional root visual references
        env:
          UPDATE_VISUAL_BASELINES: "1"
        run: |
          python3 -m pytest tests/test_dossier.py::test_visual_cover_desktop tests/test_dossier.py::test_visual_cover_mobile tests/test_dossier.py::test_visual_reduced_motion -q
      - name: Recheck and commit generated derivatives
        run: |
          ./tools/build.sh --check
          python3 -m pytest tests/test_entrance_intrusion.py tests/test_canon_inspector.py -q
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs tests/visual_baselines
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "chore: regenerate Starsilk entrance derivatives"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
