name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    name: Build, validate, unit + accessibility/network tests (Chromium)
    runs-on: ubuntu-latest
    # Visual references are generated deliberately inside this exact pinned
    # Playwright container. Visual tests wait for target images to load/decode
    # before capture, so native lazy loading cannot create false regressions.
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build from source (no media regeneration required)
        run: ./tools/build.sh

      - name: Prove the checked-in deployable docs/ matches its declared sources
        run: |
          ./tools/build.sh --check
          # qa-report.txt records runner capabilities (for example Node availability)
          # and is validation telemetry, not authoritative deployable source output.
          git diff --exit-code -- docs/ ':(exclude)docs/qa-report.txt' || {
            echo "::error::Build produced uncommitted differences in deployable docs/ -- the checked-in site and its generator have diverged.";
            exit 1;
          }

      - name: git diff --check (no whitespace-corrupt diffs)
        run: git diff --check

      - name: Full pytest + Playwright suite (Chromium)
        run: python3 -m pytest tests/ -q

      - name: Upload failed visual-regression captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: tests/visual_baselines/FAILED-*.png
          if-no-files-found: ignore

  cross-browser:
    name: Representative journeys (Firefox, WebKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: .venv/bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Build from source
        run: ./tools/build.sh

      - name: Representative cross-browser journeys
        run: .venv/bin/pytest tests/test_cross_browser.py --browser ${{ matrix.browser }} -q

  entrance-one-shot:
    name: One-shot PR46 entrance generator
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 46 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Apply bounded entrance implementation
        run: |
          python3 tools/one_shot_entrance_patch.py
          python3 - <<'PY'
          from pathlib import Path
          style = Path('src/templates/style.css')
          style.write_text(style.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          test = Path('tests/test_entrance_intrusion.py')
          text = test.read_text(encoding='utf-8')
          open_wrapper = 'f"""() => {{\n'
          close_wrapper = '        }}"""\n    )'
          if open_wrapper not in text or close_wrapper not in text:
              raise RuntimeError('intrusion test init-script wrapper markers missing')
          text = text.replace(open_wrapper, 'f"""\n', 1)
          text = text.replace(close_wrapper, '        """\n    )', 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Rebuild and verify generated publication
        run: |
          ./tools/build.sh
          ./tools/build.sh --check
          git diff --check
          python3 -m pytest tests/test_entrance_intrusion.py tests/test_canon_inspector.py -q
          python3 -m pytest \
            tests/test_dossier.py::test_no_content_blocking_gate \
            tests/test_dossier.py::test_cover_title_is_starsilk_compendium \
            tests/test_dossier.py::test_cover_title_stays_on_one_line \
            tests/test_dossier.py::test_watermark_pauses_while_cover_dominant \
            tests/test_unified_museum_shell.py \
            -q

      - name: Refresh intentional root visual references only
        env:
          UPDATE_VISUAL_BASELINES: "1"
        run: |
          python3 -m pytest \
            tests/test_dossier.py::test_visual_cover_desktop \
            tests/test_dossier.py::test_visual_cover_mobile \
            tests/test_dossier.py::test_visual_reduced_motion \
            -q

      - name: Recheck after visual reference update
        run: |
          ./tools/build.sh --check
          python3 -m pytest tests/test_entrance_intrusion.py tests/test_canon_inspector.py -q
          git diff --check

      - name: Commit source-aligned generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src docs tests
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git commit -m "feat: make the Starsilk entrance canon-first [generated]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
