name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Temporary migration job for PR #1 only. It checks out the actual PR head,
  # regenerates disposable docs output and visual references inside the exact
  # pinned Chromium container, commits only those derived files if they changed,
  # and uploads the references for human inspection. Remove this job before merge.
  synchronize-generated-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Trust the checked-out worktree
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Regenerate deployable page from authoritative source
        run: ./tools/build.sh

      - name: Upload incident image diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: incident-image-diagnostic
          path: docs/assets/media/77131487824f0919d44825fe.webp
          if-no-files-found: error

      - name: Regenerate visual references in pinned Chromium environment
        env:
          UPDATE_VISUAL_BASELINES: "1"
        run: python3 -m pytest tests/test_dossier.py -q -k 'test_visual_'

      - name: Upload visual references for inspection
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline-candidates
          path: tests/visual_baselines/*.png
          if-no-files-found: error

      - name: Commit synchronized derived outputs if changed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git add docs/index.html tests/visual_baselines/*.png
          if git diff --cached --quiet; then
            echo "Derived outputs already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: synchronize generated page and visual baselines"
          git push origin "HEAD:${HEAD_BRANCH}"

  build-and-validate:
    name: Build, validate, unit + accessibility/network tests (Chromium)
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build from source (no media regeneration required)
        run: ./tools/build.sh

      - name: Prove the checked-in deployable docs/ matches its declared sources
        run: |
          ./tools/build.sh --check
          # qa-report.txt records runner capabilities (for example Node availability)
          # and is validation telemetry, not authoritative deployable source output.
          git diff --exit-code -- docs/ ':(exclude)docs/qa-report.txt' || {
            echo "::error::Build produced uncommitted differences in deployable docs/ -- the checked-in site and its generator have diverged.";
            exit 1;
          }

      - name: git diff --check (no whitespace-corrupt diffs)
        run: git diff --check

      - name: Full pytest + Playwright suite (Chromium)
        run: python3 -m pytest tests/ -q

      - name: Upload failed visual-regression captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: tests/visual_baselines/FAILED-*.png
          if-no-files-found: ignore

  cross-browser:
    name: Representative journeys (Firefox, WebKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: .venv/bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Build from source
        run: ./tools/build.sh

      - name: Representative cross-browser journeys
        run: .venv/bin/pytest tests/test_cross_browser.py --browser ${{ matrix.browser }} -q
