name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    name: Build, validate, unit + accessibility/network tests (Chromium)
    runs-on: ubuntu-latest
    # Visual references are generated deliberately inside this exact pinned
    # Playwright container. Visual tests wait for target images to load/decode
    # before capture, so native lazy loading cannot create false regressions.
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Trust the checked-out worktree (containerized job)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Build from source (no media regeneration required)
        run: ./tools/build.sh

      - name: Prove the checked-in deployable docs/ matches its declared sources
        run: |
          ./tools/build.sh --check
          # qa-report.txt records runner capabilities (for example Node availability)
          # and is validation telemetry, not authoritative deployable source output.
          git diff --exit-code -- docs/ ':(exclude)docs/qa-report.txt' || {
            echo "::error::Build produced uncommitted differences in deployable docs/ -- the checked-in site and its generator have diverged.";
            exit 1;
          }

      - name: git diff --check (no whitespace-corrupt diffs)
        run: git diff --check

      - name: Full pytest + Playwright suite (Chromium)
        run: python3 -m pytest tests/ -q

      - name: Upload failed visual-regression captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-failures
          path: tests/visual_baselines/FAILED-*.png
          if-no-files-found: ignore

  cross-browser:
    name: Representative journeys (Firefox, WebKit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: .venv/bin/playwright install --with-deps ${{ matrix.browser }}

      - name: Build from source
        run: ./tools/build.sh

      - name: Representative cross-browser journeys
        run: .venv/bin/pytest tests/test_cross_browser.py --browser ${{ matrix.browser }} -q

  repair-pr47-visual-regressions:
    name: Repair PR47 visual regressions
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 47 && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Trust branch worktree
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Repair coverage-aware regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dossier = Path('tests/test_dossier.py')
          text = dossier.read_text(encoding='utf-8')
          replacements = [
              (
                  '"document.querySelector(\'.reference-record img, .media-item img\')?.complete"',
                  '"document.querySelector(\'#shard-god .reference-record img, #shard-god .media-item img\')?.complete"',
              ),
              (
                  'natural_width = page.evaluate("document.querySelector(\'.reference-record img, .media-item img\').naturalWidth")',
                  'natural_width = page.evaluate("document.querySelector(\'#shard-god .reference-record img, #shard-god .media-item img\').naturalWidth")',
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'missing expected dossier test marker: {old}')
          dossier.write_text(text, encoding='utf-8')

          entity = Path('tests/test_entity_permalinks.py')
          text = entity.read_text(encoding='utf-8')
          old = '        assert " ".join(published.stripped_strings) == source\n'
          new = (
              '        presentation = BeautifulSoup(str(published), "html.parser")\n'
              '        for fallback in presentation.select(\'[data-visual-coverage="fallback"]\'):\n'
              '            fallback.decompose()\n'
              '        published_source = presentation.find(id="entitySource")\n'
              '        assert published_source is not None\n'
              '        assert " ".join(published_source.stripped_strings) == source\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif '        for fallback in presentation.select(\'[data-visual-coverage="fallback"]\'):' not in text:
              raise SystemExit('missing expected entity permalink test marker')
          entity.write_text(text, encoding='utf-8')
          PY

      - name: Regenerate deterministic publication
        run: ./tools/build.sh

      - name: Deliberately refresh changed peripheral baseline
        env:
          UPDATE_VISUAL_BASELINES: '1'
        run: python3 -m pytest tests/test_dossier.py::test_visual_peripheral_entry -q

      - name: Re-compare baseline and focused repairs
        run: |
          python3 -m pytest \
            tests/test_dossier.py::test_visual_peripheral_entry \
            tests/test_dossier.py::test_portable_release_package_is_self_contained \
            tests/test_entity_permalinks.py::test_entity_pages_preserve_authoritative_source_text \
            tests/test_visual_coverage.py -q
          git diff --check

      - name: Commit bounded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_dossier.py tests/test_entity_permalinks.py tests/test_visual_coverage.py tests/visual_baselines/peripheral-index.png docs/
          git reset -- docs/qa-report.txt || true
          if git diff --cached --quiet; then
            echo "Bounded repair already matches branch."
            exit 0
          fi
          git commit -m "Repair visual coverage regressions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
