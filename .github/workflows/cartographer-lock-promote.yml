name: Promote Cartographer Lockfile

on:
  push:
    branches:
      - validation/temporal-cartographer-optimal-ci-2026-09-08
    paths:
      - '.github/workflows/cartographer-lock-promote.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: validation/temporal-cartographer-optimal-ci-2026-09-08

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate exact validated dependency lock
        working-directory: cartographer
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile to disposable branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'westkitty'
          git config user.email 'westkitty@users.noreply.github.com'
          git add cartographer/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'chore(cartographer): capture validated dependency lock'
          git push origin HEAD:validation/temporal-cartographer-optimal-ci-2026-09-08
