name: Apply Phase 04 state closure on push

on:
  push:
    branches: [phase-04-state-closure]

permissions:
  contents: write

jobs:
  close-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse the verified closure patch logic
        run: |
          python3 - <<'PYEXTRACT'
          from pathlib import Path
          source = Path('.github/workflows/apply-phase-04-state-closure.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          Path('/tmp/phase4_state_closure.py').write_text(code, encoding='utf-8')
          PYEXTRACT
          python3 /tmp/phase4_state_closure.py

      - name: Enforce two-file closure scope and retire temporary workflows
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(MUSEUM_AI_ROADMAP\.md|OPERATIONAL_STATE\.md)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::State closure changed an unauthorized path:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          git add MUSEUM_AI_ROADMAP.md OPERATIONAL_STATE.md
          git rm .github/workflows/apply-phase-04-state-closure.yml
          git rm .github/workflows/apply-phase-04-state-closure-push.yml
          staged="$(git diff --cached --name-only)"
          unexpected_staged="$(printf '%s\n' "$staged" | grep -Ev '^(MUSEUM_AI_ROADMAP\.md|OPERATIONAL_STATE\.md|\.github/workflows/apply-phase-04-state-closure(-push)?\.yml)$' || true)"
          if [ -n "$unexpected_staged" ]; then
            echo "::error::Unexpected staged closure path:"
            printf '%s\n' "$unexpected_staged"
            exit 1
          fi

      - name: Commit verified Phase 04 state closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(phase-04): record verified museum completion"
          git push origin HEAD:phase-04-state-closure
