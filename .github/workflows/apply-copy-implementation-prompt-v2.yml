name: Apply archive implementation prompt handoff v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/archive-copy-implementation-prompt

      - name: Trust checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Apply bounded source changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          shell_path = Path("src/templates/shell.html.j2")
          shell = shell_path.read_text(encoding="utf-8")
          shell = replace_once(
              shell,
              '<button type="button" id="modeToggle" aria-pressed="false" hidden>Archive tools</button><div class="page-controls-search">',
              '<button type="button" id="modeToggle" aria-pressed="false" hidden>Archive tools</button><button type="button" id="copyImplementationPrompt" hidden>Copy implementation prompt</button><span id="copyPromptStatus" class="visually-hidden" role="status" aria-live="polite"></span><div class="page-controls-search">',
              "archive prompt control markup",
          )
          shell_path.write_text(shell, encoding="utf-8")

          app_path = Path("src/templates/app.js")
          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              "  var modeToggle = document.getElementById('modeToggle');\n",
              "  var modeToggle = document.getElementById('modeToggle');\n  var copyPromptBtn = document.getElementById('copyImplementationPrompt');\n  var copyPromptStatus = document.getElementById('copyPromptStatus');\n",
              "archive prompt lookup",
          )
          app = replace_once(
              app,
              "      modeToggle.hidden = !on;\n",
              "      modeToggle.hidden = !on;\n      if(copyPromptBtn) copyPromptBtn.hidden = !on;\n      if(!on && copyPromptStatus) copyPromptStatus.textContent = '';\n",
              "archive prompt visibility",
          )
          app = replace_once(
              app,
              "  var ACCEPTED_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];\n",
              "  var ACCEPTED_TYPES = ['image/png', 'image/jpeg', 'image/webp', 'image/gif'];\n  var localFileMeta = new WeakMap();\n\n  function stageIdentity(stage, index){\n    var record = stage.closest ? stage.closest('.reference-record') : null;\n    var titleEl = record ? record.querySelector('figcaption b') : null;\n    var key = record ? record.getAttribute('data-asset-key') : '';\n    var fallback = stage.getAttribute('aria-label') || ('Legacy reference slot ' + (index + 1));\n    return {\n      slot: index + 1,\n      asset_key: key || ('slot-' + (index + 1)),\n      title: titleEl ? titleEl.textContent.trim() : fallback.replace(/^Attach image for /, '')\n    };\n  }\n\n  var initialStageState = stages.map(function(stage, index){\n    var img = stage.querySelector('img');\n    var identity = stageIdentity(stage, index);\n    return {\n      slot: identity.slot,\n      asset_key: identity.asset_key,\n      title: identity.title,\n      src: img ? (img.getAttribute('src') || '') : '',\n      hidden: img ? img.hidden : true\n    };\n  });\n",
              "archive prompt stage state",
          )
          app = replace_once(
              app,
              "    clearInlineError(stage);\n    var reader = new FileReader();",
              "    clearInlineError(stage);\n    localFileMeta.set(stage, {name: file.name || '', type: file.type || '', bytes: file.size || 0});\n    var reader = new FileReader();",
              "archive prompt file metadata",
          )
          app = replace_once(
              app,
              "        if(input) input.value = '';\n        clearInlineError(stage);",
              "        if(input) input.value = '';\n        localFileMeta.delete(stage);\n        clearInlineError(stage);",
              "archive prompt metadata clear",
          )

          prompt_js = r'''  function collectLocalArchiveChanges(){
            var changes = [];
            stages.forEach(function(stage, index){
              var initial = initialStageState[index];
              var img = stage.querySelector('img');
              var currentSrc = img ? (img.getAttribute('src') || '') : '';
              var currentHidden = img ? img.hidden : true;
              if(currentSrc === initial.src && currentHidden === initial.hidden) return;
              var identity = stageIdentity(stage, index);
              var meta = localFileMeta.get(stage) || null;
              var currentVisible = !!(currentSrc && !currentHidden);
              var initialVisible = !!(initial.src && !initial.hidden);
              changes.push({
                slot: identity.slot,
                asset_key: identity.asset_key,
                title: identity.title,
                action: currentVisible ? (initialVisible ? 'replace' : 'attach') : 'clear',
                local_file: meta ? {name: meta.name, type: meta.type, bytes: meta.bytes} : null,
                initial_src: initial.src || null
              });
            });
            return changes;
          }

          function buildImplementationPrompt(changes){
            var manifest = JSON.stringify(changes, null, 2);
            return [
              'Implement my browser-local Archive Tools changes in the Starsilk Compendium repository.',
              '',
              'Repository: https://github.com/westkitty/Starsilk_Character_Dossier',
              'Target production branch: main',
              '',
              'REALITY / AUTHORITY RULES',
              '- Inspect the current repository state before editing. Do not assume this prompt is newer than main.',
              '- Preserve the deterministic authority flow: src/content/ + src/templates/ -> build/generate.py -> docs/index.html -> build/validate.py.',
              '- Do not hand-edit docs/index.html as authoritative source.',
              '- Preserve src/canon/invariants.json as the canon-lock authority and docs/asset-manifest.json as published-media provenance.',
              '- Archive Tools are browser-local maintenance controls. This prompt is a handoff request, not evidence that GitHub was already changed.',
              '',
              'LOCAL CHANGE MANIFEST',
              manifest,
              '',
              'REQUIRED LOCAL EVIDENCE',
              '- I must also attach the locally exported starsilk_character_dossier_copy.html from Archive Tools, or the original local image files named in the manifest. The exported HTML is evidence only, not canonical source.',
              '- The export contains locally attached images as data URIs. If the export/files are missing or a listed change cannot be recovered from them, stop and ask me for the missing evidence. Do not fabricate media or infer unseen edits.',
              '- Treat only the manifest plus supplied local export/files as authorization for local Archive Tools changes. Preserve unrelated canon, prose, media, layout, behavior, and infrastructure.',
              '',
              'IMPLEMENTATION TASK',
              '1. Compare the supplied local export against the current generated site and identify only the manifest-listed Archive Tools changes.',
              '2. Map accepted changes back to authoritative source files and the existing media/provenance pipeline. Do not commit data-URI images as the final media architecture.',
              '3. If canonical original media changes, preserve the external media/source recovery model and do not claim durable recovery is complete unless that obligation is actually satisfied.',
              '4. Rebuild generated output from authoritative sources and run the canon/build validators plus relevant browser regression tests.',
              '5. Inspect the final diff and verify that only authorized changes and required generated/provenance outputs changed.',
              '6. Stage only the intended files, commit with a descriptive message, and push. If a branch/PR is required, complete that path so the verified result lands on main.',
              '7. Report the final commit SHA, files changed, validation results, and any evidence or backup obligation that remains unverified.',
              '',
              changes.length ? 'Detected browser-local Archive Tools changes: ' + changes.length + '.' : 'No browser-local attachment changes are currently detected. Do not change canon or media from this prompt alone.'
            ].join('\n');
          }

          function fallbackCopyText(text){
            return new Promise(function(resolve, reject){
              var field = document.createElement('textarea');
              field.value = text;
              field.setAttribute('readonly', '');
              field.style.position = 'fixed';
              field.style.opacity = '0';
              document.body.appendChild(field);
              field.select();
              var copied = false;
              try { copied = document.execCommand('copy'); } catch(e){}
              field.remove();
              if(copied) resolve();
              else reject(new Error('Clipboard copy was not permitted by this browser.'));
            });
          }

          function copyPlainText(text){
            if(navigator.clipboard && typeof navigator.clipboard.writeText === 'function'){
              return navigator.clipboard.writeText(text).catch(function(){ return fallbackCopyText(text); });
            }
            return fallbackCopyText(text);
          }

          if(copyPromptBtn){
            copyPromptBtn.addEventListener('click', function(){
              var changes = collectLocalArchiveChanges();
              var prompt = buildImplementationPrompt(changes);
              copyPlainText(prompt).then(function(){
                if(copyPromptStatus) copyPromptStatus.textContent = 'Implementation prompt copied. ' + changes.length + ' local change' + (changes.length === 1 ? '' : 's') + ' detected.';
              }).catch(function(){
                if(copyPromptStatus) copyPromptStatus.textContent = 'Could not copy the implementation prompt. Check clipboard permission and try again.';
              });
            });
          }

          '''
          prompt_js = "\n".join(line[10:] if line.startswith("          ") else line for line in prompt_js.splitlines()) + "\n"
          app = replace_once(
              app,
              "  window.addEventListener('beforeunload', function(e){\n",
              prompt_js + "  window.addEventListener('beforeunload', function(e){\n",
              "archive prompt behavior",
          )
          app = replace_once(
              app,
              "      clone.querySelectorAll('.asset-file, .attachment-error, #clearImages, #exportEmbedded').forEach(function(n){ n.remove(); });",
              "      clone.querySelectorAll('.asset-file, .attachment-error, #clearImages, #exportEmbedded, #copyImplementationPrompt, #copyPromptStatus').forEach(function(n){ n.remove(); });",
              "archive prompt export cleanup",
          )
          app_path.write_text(app, encoding="utf-8")
          PY

      - name: Add focused browser regression tests
        shell: bash
        run: |
          cat > tests/test_archive_prompt.py <<'PYTEST'
          import base64

          from playwright.sync_api import Page, expect


          PNG_1X1 = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M/wHwAF/gL+R2slWQAAAABJRU5ErkJggg=="
          )


          def unlock(page: Page, local_server: str):
              page.goto(f"{local_server}/index.html")
              page.locator("#dossierSearch").fill("ajd")
              expect(page.locator("#modeToggle")).to_be_visible()


          def test_copy_implementation_prompt_is_archive_only_and_relocks(page: Page, local_server):
              page.goto(f"{local_server}/index.html")
              copy_btn = page.locator("#copyImplementationPrompt")
              expect(copy_btn).to_be_hidden()
              page.locator("#dossierSearch").fill("ajd")
              expect(copy_btn).to_be_visible()
              expect(copy_btn).to_have_text("Copy implementation prompt")
              page.locator("#modeToggle").click()
              expect(copy_btn).to_be_hidden()
              page.reload()
              expect(copy_btn).to_be_hidden()


          def test_copy_implementation_prompt_captures_local_manifest(page: Page, local_server, tmp_path):
              page.context.grant_permissions(["clipboard-read", "clipboard-write"], origin=local_server)
              unlock(page, local_server)
              test_img = tmp_path / "handoff-test.png"
              test_img.write_bytes(PNG_1X1)
              page.locator(".attachment-stage .asset-file").first.set_input_files(str(test_img))
              expect(page.locator("#assetStatus")).to_contain_text("1 of 26")
              page.locator("#copyImplementationPrompt").click()
              expect(page.locator("#copyPromptStatus")).to_contain_text("Implementation prompt copied")
              prompt = page.evaluate("navigator.clipboard.readText()")
              assert "https://github.com/westkitty/Starsilk_Character_Dossier" in prompt
              assert '"asset_key": "asset-19"' in prompt
              assert '"title": "Administration allocation facility"' in prompt
              assert '"action": "attach"' in prompt
              assert '"name": "handoff-test.png"' in prompt
              assert "starsilk_character_dossier_copy.html" in prompt
              assert "Do not hand-edit docs/index.html" in prompt
              assert "Stage only the intended files" in prompt
              assert "commit with a descriptive message" in prompt
              assert "push" in prompt
              assert "lands on main" in prompt


          def test_export_strips_implementation_prompt_controls(page: Page, local_server, tmp_path):
              unlock(page, local_server)
              page.evaluate("document.querySelectorAll('details.page-disclosure').forEach(d => d.open = true)")
              with page.expect_download() as download_info:
                  page.locator("#exportEmbedded").click()
              export_path = tmp_path / "export.html"
              download_info.value.save_as(str(export_path))
              exported = export_path.read_text(encoding="utf-8")
              assert 'id="copyImplementationPrompt"' not in exported
              assert 'id="copyPromptStatus"' not in exported
          PYTEST

      - name: Build generated site from authoritative sources
        run: ./tools/build.sh

      - name: Verify deterministic deployable output
        run: |
          ./tools/build.sh --check
          git diff --check

      - name: Focused archive prompt browser tests
        run: python3 -m pytest tests/test_archive_prompt.py -q

      - name: Full Chromium regression suite
        run: python3 -m pytest tests/ -q

      - name: Firefox representative journeys
        env:
          HOME: /root
        run: python3 -m pytest tests/test_cross_browser.py --browser firefox -q

      - name: WebKit representative journeys
        env:
          HOME: /root
        run: python3 -m pytest tests/test_cross_browser.py --browser webkit -q

      - name: Record verified operational state
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("OPERATIONAL_STATE.md")
          text = path.read_text(encoding="utf-8")
          if "revision: 7" not in text:
              raise SystemExit("expected operational-state revision 7")
          text = text.replace("revision: 7", "revision: 8", 1)
          invariant = "15. Public Archive Tools remain local-only browser maintenance controls with no repository-write path. They must load locked in Reader mode, require the exact search-field unlock phrase for the current page session, and must not persist an unlocked state across reloads."
          text = text.replace(
              invariant,
              invariant + "\n16. The Archive Tools implementation handoff is evidence-only: `Copy implementation prompt` appears only in Archive mode, derives a manifest from current browser-local attachment differences, requires exported local HTML or original files as evidence, preserves source/build/canon/media authority, and never implies that copying a prompt wrote to GitHub.",
              1,
          )
          run_id = os.environ["GITHUB_RUN_ID"]
          section = f'''\n## Archive implementation prompt handoff — VERIFIED\n\nGitHub Actions run `{run_id}` implemented and verified the archive-only handoff control before commit:\n\n- `Copy implementation prompt` is hidden in Reader mode and visible only after exact `ajd` Archive Tools unlock.\n- Reader mode and reload hide it again.\n- The copied prompt includes repository target, authority rules, a generated browser-local change manifest, exported-HTML/original-file evidence requirements, validation, diff discipline, and stage/commit/push instructions.\n- Local image bytes remain browser-local unless the user exports the HTML snapshot or supplies the original files.\n- The prompt forbids treating generated `docs/index.html` or data-URI exports as canonical source and preserves the external canonical-media recovery obligation.\n- Exported HTML copies strip the implementation-prompt controls.\n- Generated output was rebuilt from authoritative `src/` sources.\n- Focused archive-prompt browser tests passed.\n- Full Chromium pytest/Playwright suite passed.\n- Firefox representative journeys passed.\n- WebKit representative journeys passed.\n- `./tools/build.sh --check` and `git diff --check` passed.\n'''
          text = text.replace("\n## Known limitations\n", section + "\n## Known limitations\n", 1)
          marker = "- One-time recovery branch `recovery/canonical-media-archive` may remain until branch cleanup is available; its PR is execution-only and must not be merged into production.\n"
          text = text.replace(
              marker,
              marker + "- Archive attachment changes are not automatically persisted in browser storage. The exported HTML copy is the local evidence snapshot; implementation tools still need that export or the original local files to recover image bytes.\n",
              1,
          )
          text = text.rstrip() + "\n- Revision 8: added an Archive-mode-only Copy implementation prompt handoff that captures the current local attachment-change manifest, requires exported/local evidence, preserves repository authority, and directs a repo-aware implementation tool through validation, staging, commit, and push.\n"
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove one-time workflow and stage commit push verified change set
        shell: bash
        run: |
          git checkout -- docs/qa-report.txt || true
          rm -f .github/workflows/apply-copy-implementation-prompt-v2.yml
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add archive implementation prompt handoff"
          git push origin HEAD:work/archive-copy-implementation-prompt
