<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sprite Foundry</title>
  <meta name="description" content="AI sprite production workstation: generate characters, direct motion, repair frames, slice and pack sheets, export game-ready animation." />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='8' height='8' fill='%234c9aff'/><rect x='8' y='8' width='8' height='8' fill='%234ce0c3'/></svg>" />
</head>
<body>
  <header id="topbar">
    <div class="brand" title="Sprite Foundry">
      <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><rect width="8" height="8" fill="#4c9aff"/><rect x="8" y="8" width="8" height="8" fill="#4ce0c3"/></svg>
      <span>Sprite Foundry</span>
    </div>
    <input id="project-name" type="text" value="Untitled Project" aria-label="Project name" />
    <div class="topbar-group" role="toolbar" aria-label="Project">
      <button id="btn-undo" class="btn ghost" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
      <button id="btn-redo" class="btn ghost" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-save-project" class="btn ghost" title="Save portable .spriteproject file">Save Project</button>
      <button id="btn-open-project" class="btn ghost" title="Open .spriteproject file">Open Project</button>
      <button id="btn-inspect" class="btn ghost" title="Deterministic animation QA review">Inspect Animation</button>
      <span class="sep" aria-hidden="true"></span>
      <button id="btn-jobs" class="btn ghost" title="Generation queue">Jobs <span id="jobs-count" class="count-badge" hidden></span></button>
      <button id="btn-provider" class="btn ghost" title="Image generation provider status"><span id="provider-dot" class="dot dot-off" aria-hidden="true"></span><span id="provider-label">Provider…</span></button>
      <button id="btn-settings" class="btn ghost" title="Settings & local data">⚙</button>
    </div>
    <div id="autosave-status" class="autosave" role="status" aria-live="polite"></div>
  </header>

  <nav id="stagebar" aria-label="Production stages">
    <button data-stage="create" class="stage-btn active" aria-current="true"><b>CREATE</b><span>character</span></button>
    <button data-stage="motion" class="stage-btn"><b>MOTION</b><span>direction</span></button>
    <button data-stage="frames" class="stage-btn"><b>FRAMES</b><span>edit & QA</span></button>
    <button data-stage="slice" class="stage-btn"><b>SLICE</b><span>import sheets</span></button>
    <button data-stage="pack" class="stage-btn"><b>PACK</b><span>sheet builder</span></button>
    <button data-stage="export" class="stage-btn"><b>EXPORT</b><span>ship it</span></button>
  </nav>

  <main id="main">
    <aside id="leftpanel" aria-label="Project browser">
      <div class="panel-head">
        <span>PROJECT</span>
        <button id="btn-add-character" class="mini-btn" title="Add character">+ Char</button>
      </div>
      <div id="project-tree"></div>
    </aside>

    <section id="center">
      <div id="canvas-toolbar" role="toolbar" aria-label="View">
        <button class="mini-btn" data-zoom="-1" title="Zoom out (-)">−</button>
        <button class="mini-btn" data-zoom="1" title="Zoom in (+)">+</button>
        <button class="mini-btn" id="btn-fit" title="Fit to view (0)">Fit</button>
        <button class="mini-btn" id="btn-100" title="100% (1)">1:1</button>
        <button class="mini-btn" id="btn-nn" title="Nearest-neighbor scaling (pixel-sharp)" aria-pressed="true">NN</button>
        <span class="sep"></span>
        <label class="ov-toggle" title="Pixel grid"><input type="checkbox" data-ov="grid" />grid</label>
        <label class="ov-toggle" title="Pivot marker"><input type="checkbox" data-ov="pivot" checked />pivot</label>
        <label class="ov-toggle" title="Ground guide"><input type="checkbox" data-ov="ground" checked />ground</label>
        <label class="ov-toggle" title="Bounding box"><input type="checkbox" data-ov="bbox" />bbox</label>
        <label class="ov-toggle" title="Boxes (hitboxes)"><input type="checkbox" data-ov="boxes" checked />boxes</label>
        <label class="ov-toggle" title="Attachment points"><input type="checkbox" data-ov="points" checked />points</label>
        <select id="onion-select" class="mini-select" title="Onion skin" aria-label="Onion skin depth">
          <option value="0">onion off</option>
          <option value="1">onion ±1</option>
          <option value="2">onion ±2</option>
        </select>
        <input id="onion-opacity" type="range" min="10" max="90" value="35" title="Onion opacity" aria-label="Onion opacity" />
        <span class="sep"></span>
        <select id="bg-select" class="mini-select" title="Preview background" aria-label="Preview background">
          <option value="checkerboard">checkerboard</option>
          <option value="dark">dark</option>
          <option value="light">light</option>
          <option value="#8866aa">custom…</option>
        </select>
      </div>
      <div id="canvas-wrap">
        <canvas id="view" tabindex="0" aria-label="Sprite canvas"></canvas>
        <div id="canvas-hud" aria-hidden="true"></div>
        <div id="empty-state" hidden>
          <div class="empty-box">
            <p>No character yet. Start with:</p>
            <div class="empty-actions">
              <button class="btn" data-start="generate">Generate Character</button>
              <button class="btn" data-start="import">Import Sprite</button>
              <button class="btn" data-start="sheet">Import Sprite Sheet</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <aside id="rightpanel" aria-label="Inspector">
      <div id="inspector"></div>
    </aside>
  </main>

  <footer id="timelinebar" aria-label="Animation timeline">
    <div id="timeline"></div>
  </footer>

  <div id="jobs-drawer" hidden></div>
  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
